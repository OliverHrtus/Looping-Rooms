<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping Rooms</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .inv-slot {
            width: 56px;
            height: 56px;
            background: rgba(30, 30, 30, 0.85);
            border: 2px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: border-color 0.15s;
        }

        .inv-slot.active {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }
rooms
        .inv-slot .slot-key {
            position: absolute;
            top: 3px;
            left: 5px;
            font-size: 10px;
            color: #888;
            font-family: monospace;
        }

        .inv-slot .item-icon {
            font-size: 26px;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .inv-slot .item-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .inv-slot .item-count {
            position: absolute;
            bottom: 3px;
            right: 5px;
            font-size: 11px;
            color: #fff;
            font-family: monospace;
            font-weight: bold;
        }

        #dialogue-panel {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: min(700px, 92vw);
            background: #000;
            border: 4px solid #fff;
            border-radius: 4px;
            padding: 18px 24px 16px 24px;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s, transform 0.15s;
            box-shadow: 0 0 0 2px #000, 0 0 0 6px #fff, 4px 6px 0 6px #000;
        }

        #dialogue-panel.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateX(-50%) translateY(0);
        }

        #dialogue-text {
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 26px;
            color: #fff;
            line-height: 1.45;
            min-height: 52px;
            white-space: pre-wrap;
            letter-spacing: 0.03em;
        }

        #dialogue-cursor {
            display: inline-block;
            width: 14px;
            height: 3px;
            background: #fff;
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 0.7s step-end infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0
            }
        }

        #dialogue-hint {
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 16px;
            color: #888;
            text-align: right;
            margin-top: 6px;
            letter-spacing: 0.05em;
        }

        #note-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background: #f5f0e8;
            border: 2px solid #c8b89a;
            border-radius: 4px;
            padding: 28px 32px;
            width: 320px;
            box-shadow: 6px 6px 24px rgba(0, 0, 0, 0.6);
            z-index: 20;
            display: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        #note-modal.open {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #note-modal h2 {
            margin: 0 0 14px 0;
            font-size: 14px;
            color: #888;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #note-modal p {
            margin: 0;
            font-size: 22px;
            color: #2a2a2a;
            font-family: Georgia, serif;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        #note-modal .close-hint {
            margin-top: 18px;
            font-size: 11px;
            color: #aaa;
            font-family: monospace;
            text-align: right;
        }

        #lockbox-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background: #1c1c1c;
            border: 3px solid #555;
            border-radius: 8px;
            padding: 30px 36px;
            width: 360px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            z-index: 20;
            display: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        #lockbox-modal.open {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #lockbox-modal h2 {
            margin: 0 0 4px 0;
            font-size: 13px;
            color: #888;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .box-icon {
            font-size: 42px;
            margin-bottom: 14px;
        }

        .digits {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 18px 0;
        }

        .digit-slot {
            width: 58px;
            height: 74px;
            background: #0a0a0a;
            border: 2px solid #444;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .d-arrow {
            width: 100%;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 13px;
            user-select: none;
            transition: color 0.1s, background 0.1s;
        }

        .d-arrow:hover {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.08);
        }

        .d-num {
            font-size: 30px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #fff;
            line-height: 1;
        }

        .lb-btn {
            margin-top: 4px;
            padding: 10px 32px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 6px;
            color: #ccc;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.15s;
        }

        .lb-btn:hover {
            background: #3a3a3a;
            border-color: #ffd700;
            color: #ffd700;
        }

        .lb-msg {
            margin-top: 12px;
            font-size: 13px;
            font-family: monospace;
            min-height: 18px;
            letter-spacing: 1px;
        }

        .lb-msg.error {
            color: #ff4444;
        }

        .lb-msg.success {
            color: #44ff88;
        }

        .lb-close-hint {
            margin-top: 12px;
            font-size: 11px;
            color: #444;
            font-family: monospace;
        }

        #pickup-prompt {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ffd700;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        #pickup-prompt.visible {
            opacity: 1;
        }

        #door-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(180, 30, 30, 0.92);
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 15;
            border: 1px solid #ff5555;
            white-space: nowrap;
        }

        #door-msg.visible {
            opacity: 1;
        }

        #fade-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 2s ease;
        }

        #fade-overlay.fading {
            opacity: 1;
            pointer-events: all;
        }

        #active-item-label {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ffd700;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        #active-item-label.visible {
            opacity: 1;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <div id="lockbox-modal">
        <div class="box-icon" id="lb-icon">📦</div>
        <h2>Number Lock</h2>
        <div class="digits">
            <div class="digit-slot">
                <div class="d-arrow" id="up0">▲</div>
                <div class="d-num" id="dn0">0</div>
                <div class="d-arrow" id="ddn0">▼</div>
            </div>
            <div class="digit-slot">
                <div class="d-arrow" id="up1">▲</div>
                <div class="d-num" id="dn1">0</div>
                <div class="d-arrow" id="ddn1">▼</div>
            </div>
            <div class="digit-slot">
                <div class="d-arrow" id="up2">▲</div>
                <div class="d-num" id="dn2">0</div>
                <div class="d-arrow" id="ddn2">▼</div>
            </div>
            <div class="digit-slot">
                <div class="d-arrow" id="up3">▲</div>
                <div class="d-num" id="dn3">0</div>
                <div class="d-arrow" id="ddn3">▼</div>
            </div>
        </div>
        <button class="lb-btn" id="lb-unlock-btn">UNLOCK</button>
        <div class="lb-msg" id="lb-msg"></div>
        <div class="lb-close-hint">Press ESC to close</div>
    </div>

    <script>


        
        
        
        const dialoguePanel = document.getElementById('dialogue-panel');
        const dialogueText = document.getElementById('dialogue-text');
        const dialogueHint = document.getElementById('dialogue-hint');
        let dialogueOpen = false, dialoguePages = [], dialoguePage = 0;
        let dialogueCloseCallback = null;
        let typewriterTimer = null, typewriterDone = false, typewriterChars = 0;
        const TYPEWRITER_SPEED = 28;
        function openDialogue(pages, onClose = null) { if (!pages || !pages.length) return; dialoguePages = pages; dialoguePage = 0; dialogueOpen = true; dialogueCloseCallback = onClose; dialoguePanel.classList.add('visible'); showPage(0); }
        function showPage(idx) { const text = dialoguePages[idx] || ''; dialogueText.textContent = ''; typewriterChars = 0; typewriterDone = false; clearInterval(typewriterTimer); const isLast = idx >= dialoguePages.length - 1; dialogueHint.textContent = isLast ? '[ E / Z  to close ]' : '[ E / Z  to continue ]'; typewriterTimer = setInterval(() => { typewriterChars++; dialogueText.textContent = text.slice(0, typewriterChars); if (typewriterChars >= text.length) { clearInterval(typewriterTimer); typewriterDone = true; const cursor = document.createElement('span'); cursor.id = 'dialogue-cursor'; dialogueText.appendChild(cursor); } }, TYPEWRITER_SPEED); }
        function advanceDialogue() { if (!dialogueOpen) return; if (!typewriterDone) { clearInterval(typewriterTimer); typewriterDone = true; dialogueText.textContent = dialoguePages[dialoguePage]; const cursor = document.createElement('span'); cursor.id = 'dialogue-cursor'; dialogueText.appendChild(cursor); return; } dialoguePage++; if (dialoguePage >= dialoguePages.length) { closeDialogue(); } else { showPage(dialoguePage); } }
        function closeDialogue() { clearInterval(typewriterTimer); dialogueOpen = false; dialoguePanel.classList.remove('visible'); dialogueText.textContent = ''; if (typeof dialogueCloseCallback === 'function') { const callback = dialogueCloseCallback; dialogueCloseCallback = null; callback(); } }

        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        

        const W = 2200, H = 1600;
        const CORR_Y1 = 613, CORR_Y2 = 975, CORR_X1 = 925, CORR_X2 = 1275;
        
        const NW_SPLIT_X = 462, NW_SPLIT_Y = 300;
        const NE_SPLIT_X = 1737, NE_SPLIT_Y = 300;
        const SW_SPLIT_X = 462, SW_SPLIT_Y = 1287;
        const SE_SPLIT_X = 1737, SE_SPLIT_Y = 1287;

        const NW_KITCHEN_BOTTOM = 508; 

        
        const DOOR_W = 12, DOOR_OPENING = 130;

        
        
        
        const NW_NE_DOOR_CENTER = 430; 
        const SW_SE_DOOR_CENTER = 1131; 

        const APT_DOORS = [
            
            { id: 'door_NW', aptId: 'NW', x: CORR_X1 - DOOR_W, y: NW_NE_DOOR_CENTER - DOOR_OPENING / 2, w: DOOR_W, h: DOOR_OPENING, side: 'east', openAnim: 0, isOpen: false },
            
            { id: 'door_NE', aptId: 'NE', x: CORR_X2, y: NW_NE_DOOR_CENTER - DOOR_OPENING / 2, w: DOOR_W, h: DOOR_OPENING, side: 'west', openAnim: 0, isOpen: false },
            
            { id: 'door_SW', aptId: 'SW', x: CORR_X1 - DOOR_W, y: SW_SE_DOOR_CENTER - DOOR_OPENING / 2, w: DOOR_W, h: DOOR_OPENING, side: 'east', openAnim: 0, isOpen: false, restricted: true },
            
            { id: 'door_SE', aptId: 'SE', x: CORR_X2, y: SW_SE_DOOR_CENTER - DOOR_OPENING / 2, w: DOOR_W, h: DOOR_OPENING, side: 'west', openAnim: 0, isOpen: false, restricted: true },
        ];

        
        const exitDoors = [
            { id: 'main', x: 2180, y: 760, w: 20, h: 80, label: 'M' },
        ];

        
        
        
        const LOCK_CODE = '6658';
        const lbDigits = [0, 0, 0, 0];
        const lbNumEls = [document.getElementById('dn0'), document.getElementById('dn1'), document.getElementById('dn2'), document.getElementById('dn3')];
        function lbChangeDigit(idx, dir) { lbDigits[idx] = (lbDigits[idx] + dir + 10) % 10; lbNumEls[idx].textContent = lbDigits[idx]; const msg = document.getElementById('lb-msg'); msg.textContent = ''; msg.className = 'lb-msg'; }
        document.querySelectorAll('.digit-slot').forEach((slot, idx) => { const arrows = slot.querySelectorAll('.d-arrow'); arrows[0].addEventListener('click', () => lbChangeDigit(idx, 1)); arrows[1].addEventListener('click', () => lbChangeDigit(idx, -1)); });
        document.getElementById('lb-unlock-btn').addEventListener('click', () => { const msg = document.getElementById('lb-msg'); if (lbDigits.join('') === LOCK_CODE) { msg.textContent = '✓ Unlocked!'; msg.className = 'lb-msg success'; document.getElementById('lb-icon').textContent = '📭'; if (currentLockbox) currentLockbox.unlocked = true; addToInventory({ id: 'key_exit', icon: '🪪', texture: 'assets/exit_card.png', label: 'Exit Card', count: 1 }); setTimeout(closeLockbox, 1200); } else { msg.textContent = '✗ Wrong code'; msg.className = 'lb-msg error'; } });

        
        
        
        const INVENTORY_SIZE = 10;
        const inventory = Array(INVENTORY_SIZE).fill(null);
        let activeSlot = 0;
        function saveInventory() { const payload = JSON.stringify({ ts: Date.now(), slots: inventory }); try { sessionStorage.setItem('looping_rooms_inventory', payload); } catch (e) { } try { localStorage.setItem('looping_rooms_inventory', payload); } catch (e) { } }
        function loadInventory() { let best = null; for (const store of [sessionStorage, localStorage]) { try { const raw = store.getItem('looping_rooms_inventory'); if (!raw) continue; const p = JSON.parse(raw); if (!best || p.ts > best.ts) best = p; } catch (e) { } } if (!best) return; for (let i = 0; i < INVENTORY_SIZE; i++)inventory[i] = best.slots[i] || null; renderInventory(); }
        function addToInventory(item) { for (let i = 0; i < INVENTORY_SIZE; i++) { if (inventory[i] && inventory[i].id === item.id) { inventory[i].count++; renderInventory(); saveInventory(); return true; } } for (let i = 0; i < INVENTORY_SIZE; i++) { if (!inventory[i]) { inventory[i] = { ...item, count: 1 }; renderInventory(); saveInventory(); return true; } } return false; }
        let activeItemLabelTimer = null;
        function renderInventory() { for (let i = 0; i < INVENTORY_SIZE; i++) { document.getElementById(`slot-${i}`).classList.toggle('active', i === activeSlot); const iconSlot = document.getElementById(`icon-${i}`); iconSlot.innerHTML = ''; if (inventory[i]) { const img = inventory[i].texture ? _texCache[inventory[i].texture] : null; if (img && img.complete && img.naturalWidth > 0) { const imgEl = document.createElement('img'); imgEl.src = inventory[i].texture; iconSlot.appendChild(imgEl); } else { iconSlot.textContent = inventory[i].icon; } } document.getElementById(`count-${i}`).textContent = inventory[i] && inventory[i].count > 1 ? inventory[i].count : ''; } const el = document.getElementById('active-item-label'); clearTimeout(activeItemLabelTimer); if (inventory[activeSlot]) { const item = inventory[activeSlot]; el.textContent = item.count > 1 ? `${item.icon} ${item.label} x${item.count}` : `${item.icon} ${item.label}`; el.classList.add('visible'); activeItemLabelTimer = setTimeout(() => el.classList.remove('visible'), 2500); } else { el.classList.remove('visible'); } }

        function getActiveInventoryItem() { return inventory[activeSlot]; }

        function readActiveInventoryNote() {
            if (noteOpen || lockboxOpen || isTransitioning || dialogueOpen) return false;
            const item = getActiveInventoryItem();
            if (!item) return false;

            
            let pages = [];

            if (item.dialogue && item.dialogue.length > 0) {
                pages = [...item.dialogue];
            } else if (item.noteTitle || item.noteContent) {
                if (item.noteTitle) pages.push(`* ${item.noteTitle}`);
                if (item.noteContent) pages.push(`* ${item.noteContent}`);
            }

            if (!pages.length) return false;

            openDialogue(pages);
            return true;
        }

        
        
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        const texturedObjects = [


            
            
            
            { id: 'nw_fridge', x: 20, y: 20, width: 60, height: 100, texture: 'assets/fridge.png', label: 'Fridge', solid: true, dialogue: ['* A large fridge humming quietly.', '* The door is slightly ajar.', '* Inside, you see a faint glint of something metallic.'] },
            {
                id: 'nw_oven', x: 180, y: 20, width: 70, height: 60, texture: 'assets/oven.png', label: 'Oven', solid: true,
                dialogue: ['* A dusty oven with a broken door.', '* It seems to be stuck shut.', '* Maybe there is something inside?'],
                
            },
            { id: 'nw_washing_machine', x: 300, y: 20, width: 70, height: 60, texture: 'assets/washing_machine.png', label: 'Washing Machine', solid: true, dialogue: ['* An old washing machine.'] },
            {
                id: 'nw_cabinet', x: 380, y: 170, width: 80, height: 100, texture: 'assets/cabinet.png', label: 'Kitchen Cabinet', solid: true,
                dialogue: ['* A wooden kitchen cabinet.' , '* The doors are closed.', '* You can see a small screwdriver lying on one of the shelves.'],
                 isCustomPuzzle: true, requiresItem: 'key_kitchen_cabinet', unlocked: false, itemTaken: false,
                containsItem: { id: 'key_liqor', icon: '🔑', label: 'Liquor Cabinet Key' },
                
            },

            
            
            
            { id: 'nw_bed', x: 580, y: 20, width: 130, height: 115, texture: 'assets/bed.png', label: 'Bed', solid: true, dialogue: ['* A sturdy bed.', '* It looks comfortable.'] },
            { id: 'nw_nightstand', x: 500, y: 20, width: 60, height: 60, texture: 'assets/night_table.png', label: 'Nightstand', solid: true, dialogue: ['* A small nightstand.'] },
            {
                id: 'nw_desk', x: 810, y: 220, width: 100, height: 60, texture: 'assets/desk.png', label: 'Desk', solid: true,
                dialogue: ['* A wooden desk.', '* The top drawer is slightly open.', '* Inside, you find...', '* Nothing.'],
              
            },
            { id: 'nw_dresser', x: 850, y: 35, width: 40, height: 100, texture: 'assets/dresser.png', label: 'Dresser', solid: true, dialogue: ['* A tall dresser with several drawers.'] },

            
            
            
            { id: 'nw_sink', x: 145, y: 330, width: 80, height: 60, texture: 'assets/sink.png', label: 'Sink', solid: true, dialogue: ['* A bathroom sink with a mirror above it.', '* The faucet drips occasionally.'] },
            { id: 'nw_toilet', x: 10, y: 450, width: 60, height: 60, texture: 'assets/toilet.png', label: 'Toilet', solid: true, dialogue: ['* A simple toilet.'] },

                    ctx.fillRect(wallX, mid + (dH / 2) * anim, W12, halfH);
                }
                ctx.strokeStyle = `rgba(170,110,70,${1 - anim})`; ctx.lineWidth = 1.5;
                if (halfH > 0.5) {
                    ctx.strokeRect(wallX, dY, W12, halfH);
                    ctx.strokeRect(wallX, mid + (dH / 2) * anim, W12, halfH);
                }
                ctx.shadowBlur = 0;
            }
            
            ctx.strokeStyle = `rgba(150,95,60,${0.5 * (1 - anim) + 0.1})`; ctx.lineWidth = 2;
            ctx.strokeRect(wallX - 1, dY, W12 + 2, dH);
        }

        function drawSingleItem(item, bobY) {
            const cx = item.x + item.width / 2, cy = bobY + item.height / 2;
            const img = item.texture ? _texCache[item.texture] : null;
            const gc = item.isLockbox ? (item.unlocked ? 'rgba(68,255,136,' : 'rgba(255,80,80,') : 'rgba(255,215,0,';
            const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 28);
            grad.addColorStop(0, gc + '0.35)'); grad.addColorStop(1, gc + '0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.fill();
            if (img && img.complete && img.naturalWidth > 0) { ctx.drawImage(img, item.x, bobY, item.width, item.height); }
            else { if (item.isLockbox) { ctx.fillStyle = item.unlocked ? '#1a3a2a' : '#2a1a1a'; ctx.strokeStyle = item.unlocked ? '#44ff88' : '#ff5050'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(item.x, bobY, item.width, item.height, 5); ctx.fill(); ctx.stroke(); ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(item.unlocked ? '📭' : '🔒', cx, cy); } else { ctx.font = `${item.width}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(item.icon || '❓', cx, cy); } }
            ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            
            const dx = (player.x + player.width / 2) - (item.x + item.width / 2);
            const dy = (player.y + player.height / 2) - (item.y + item.height / 2);
            if (Math.abs(dx) < 70 && Math.abs(dy) < 70) { ctx.strokeStyle = 'rgba(255,215,0,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([]); ctx.strokeRect(item.x - 2, bobY - 2, item.width + 4, item.height + 4); }
        }

        function drawTexturedObjects() {
            const t = Date.now() / 600;

            for (let obj of texturedObjects) {
                
                const objCenterX = obj.x + (obj.width / 2);
                const objCenterY = obj.y + (obj.height / 2);

                if (!isCoordinateVisible(objCenterX, objCenterY)) {
                    continue; 
                }

                
                if (obj.collected) continue;

                
                if (obj.IsPuzzleItem) {
                    const idx = texturedObjects.indexOf(obj);
                    drawSingleItem(obj, obj.y + Math.sin(t + idx * 1.3) * 4);
                } else {
                    
                    const forcedWallIds = ['textured_obj_14', 'textured_obj_15', 'textured_obj_16'];
                    if (forcedWallIds.includes(obj.id)) {
                        
                        drawWallSegment(obj.x, obj.y, obj.width, obj.height, '#000000', 'rgba(200,200,200,0.4)');
                        continue;
                    }
                    const img = obj.texture ? _texCache[obj.texture] : null;
                    if (img && img.complete && img.naturalWidth > 0) {
                        ctx.drawImage(img, obj.x, obj.y, obj.width, obj.height);
                    } else {
                        ctx.fillStyle = '#2a2a3a';
                        ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                        ctx.setLineDash([4, 4]);
                        ctx.strokeStyle = '#6666aa';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(obj.x + 1, obj.y + 1, obj.width - 2, obj.height - 2);
                        ctx.setLineDash([]);
                        ctx.font = (Math.min(obj.width, obj.height) * 0.45) + 'px serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = 'rgba(180,180,220,0.5)';
                        ctx.fillText(obj.icon || '🖼️', obj.x + obj.width / 2, obj.y + obj.height / 2);
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'alphabetic';
                    }
                }
            }
        }

        function drawDroppedItems() {
            const t = Date.now() / 600;

            for (let item of droppedItems) {
                
                if (item.collected) continue;

                
                if (!isCoordinateVisible(item.x, item.y)) {
                    continue; 
                }

                
                const idx = droppedItems.indexOf(item);

                
                ctx.globalAlpha = 0.88;
                drawSingleItem(item, item.y + Math.sin(t + idx * 2.1 + 99) * 3);
                ctx.globalAlpha = 1;
            }
        }

        function drawPlayer() {
            
            if (PLAYER_SPRITE._ready) { drawSpritePlayer(); return; }

            const px = player.x, py = player.y;
            const pw = player.width, ph = player.height;
            const cx = px + pw / 2;

            
            const facing  = player.facing;
            const frame   = player.animFrame;      
            const moving  = player.moving;
            
            const idleBob = moving ? 0 : Math.sin(player.idleTimer * 0.05) * 1.2;

            
            
            const legSwing = moving ? (frame === 0 ? 1 : -1) : 0;

            
            const skinColor   = '#f5c59a';
            const hairColor   = '#3a2010';
            const shirtColor  = '#4a7fc1';
            const pantsColor  = '#2a3a5a';
            const shoeColor   = '#1a1a1a';
            const shadowColor = 'rgba(0,0,0,0.25)';

            ctx.save();

            
            ctx.fillStyle = shadowColor;
            ctx.beginPath();
            ctx.ellipse(cx, py + ph + 2, pw * 0.38, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            
            
            const footY = py + ph;
            ctx.translate(cx, footY + idleBob);

            
            function rRect(x, y, w, h, r) {
                ctx.beginPath();
                ctx.roundRect(x - w/2, y - h, w, h, r);
                ctx.fill();
            }

            if (facing === 'down') {
                

                
                const legW = 10, legH = 15;
                const legY = 0; 
                
                ctx.fillStyle = pantsColor;
                ctx.beginPath();
                ctx.roundRect(-legW - 1 + legSwing * 2, -legH, legW, legH, 3);
                ctx.fill();
                
                ctx.beginPath();
                ctx.roundRect(1 - legSwing * 2, -legH, legW, legH, 3);
                ctx.fill();

                
                ctx.fillStyle = shoeColor;
                ctx.beginPath(); ctx.ellipse(-legW/2 + legSwing * 2, -1, 7, 4, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(legW/2 + 1 - legSwing * 2 + 1, -1, 7, 4, 0, 0, Math.PI*2); ctx.fill();

                
                const bodyTop = -(legH + 18);
                ctx.fillStyle = shirtColor;
                ctx.beginPath();
                ctx.roundRect(-11, bodyTop, 22, 20, 4);
                ctx.fill();

                
                const armY = bodyTop + 4;
                const armSwingX = moving ? legSwing * 3 : 0;
                ctx.fillStyle = shirtColor;
                
                ctx.beginPath(); ctx.roundRect(-18, armY - armSwingX, 7, 14, 3); ctx.fill();
                
                ctx.beginPath(); ctx.roundRect(11, armY + armSwingX, 7, 14, 3); ctx.fill();
                
                ctx.fillStyle = skinColor;
                ctx.beginPath(); ctx.arc(-14.5, armY + 14 - armSwingX, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(14.5, armY + 14 + armSwingX, 4, 0, Math.PI*2); ctx.fill();

                
                const headY = bodyTop - 2;
                ctx.fillStyle = skinColor;
                ctx.beginPath(); ctx.arc(0, headY - 9, 11, 0, Math.PI*2); ctx.fill();

                
                ctx.fillStyle = hairColor;
                ctx.beginPath();
                ctx.arc(0, headY - 11, 10, Math.PI, 0, false);
                ctx.fill();
                
                ctx.fillStyle = '#222';
                ctx.beginPath(); ctx.arc(-4, headY - 9, 1.8, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(4, headY - 9, 1.8, 0, Math.PI*2); ctx.fill();

            } else if (facing === 'up') {
                

                
                const legW = 10, legH = 15;
                ctx.fillStyle = pantsColor;
                ctx.beginPath(); ctx.roundRect(-legW - 1 + legSwing * 2, -legH, legW, legH, 3); ctx.fill();
                ctx.beginPath(); ctx.roundRect(1 - legSwing * 2, -legH, legW, legH, 3); ctx.fill();

                
                ctx.fillStyle = shoeColor;
                ctx.beginPath(); ctx.ellipse(-legW/2 + legSwing * 2, -1, 7, 4, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(legW/2 + 1 - legSwing * 2 + 1, -1, 7, 4, 0, 0, Math.PI*2); ctx.fill();

                
                const bodyTop = -(legH + 18);
                ctx.fillStyle = shirtColor;
                ctx.beginPath(); ctx.roundRect(-11, bodyTop, 22, 20, 4); ctx.fill();

                
                const armY = bodyTop + 4;
                const armSwingX = moving ? legSwing * 3 : 0;
                ctx.fillStyle = shirtColor;
                ctx.beginPath(); ctx.roundRect(-18, armY + armSwingX, 7, 14, 3); ctx.fill();
                ctx.beginPath(); ctx.roundRect(11, armY - armSwingX, 7, 14, 3); ctx.fill();
                ctx.fillStyle = skinColor;
                ctx.beginPath(); ctx.arc(-14.5, armY + 14 + armSwingX, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(14.5, armY + 14 - armSwingX, 4, 0, Math.PI*2); ctx.fill();

                
                const headY = bodyTop - 2;
                ctx.fillStyle = skinColor;
                ctx.beginPath(); ctx.arc(0, headY - 9, 11, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = hairColor;
                ctx.beginPath(); ctx.arc(0, headY - 9, 10.5, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = skinColor;
                ctx.beginPath(); ctx.arc(-10, headY - 9, 3.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(10, headY - 9, 3.5, 0, Math.PI*2); ctx.fill();

            } else {
                
                const dir = (facing === 'right') ? 1 : -1; 

                
                const legH = 15;
                const frontLegOff = legSwing * 4 * dir;
                const backLegOff  = -legSwing * 3 * dir;

                
                ctx.fillStyle = '#1c2a40';
                ctx.beginPath(); ctx.roundRect(-5, -legH + backLegOff, 9, legH, 3); ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.ellipse(dir * 3, -1 + backLegOff, 6, 4, 0, 0, Math.PI*2); ctx.fill();

                
                ctx.fillStyle = pantsColor;
                ctx.beginPath(); ctx.roundRect(-5, -legH + frontLegOff, 9, legH, 3); ctx.fill();
                ctx.fillStyle = shoeColor;
                ctx.beginPath(); ctx.ellipse(dir * 4, -1 + frontLegOff, 7, 4, 0, 0, Math.PI*2); ctx.fill();

                
                const bodyTop = -(legH + 18);
                ctx.fillStyle = shirtColor;
                ctx.beginPath(); ctx.roundRect(-9, bodyTop, 18, 20, 4); ctx.fill();

                
                const armSwing = moving ? legSwing * 4 : 0;
                ctx.fillStyle = '#3a6aab';
                ctx.beginPath(); ctx.roundRect(-6, bodyTop + 4 + armSwing * dir, 8, 14, 3); ctx.fill();
                ctx.fillStyle = '#d4a87a';
                ctx.beginPath(); ctx.arc(-2, bodyTop + 18 + armSwing * dir, 4, 0, Math.PI*2); ctx.fill();

                
                ctx.fillStyle = shirtColor;
                ctx.beginPath(); ctx.roundRect(-6, bodyTop + 4 - armSwing * dir, 8, 14, 3); ctx.fill();
                ctx.fillStyle = skinColor;
                ctx.beginPath(); ctx.arc(-2, bodyTop + 18 - armSwing * dir, 4, 0, Math.PI*2); ctx.fill();

                
                const headY = bodyTop - 2;
                ctx.fillStyle = skinColor;
                ctx.beginPath(); ctx.arc(dir * 1, headY - 9, 11, 0, Math.PI*2); ctx.fill();

                
                ctx.fillStyle = hairColor;
                ctx.beginPath();
                ctx.arc(dir * 1, headY - 11, 10, Math.PI * 1.1, Math.PI * 0.0, false);
                ctx.closePath();
                ctx.fill();

                
                ctx.fillStyle = '#222';
                ctx.beginPath(); ctx.arc(dir * 7, headY - 9, 1.8, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = skinColor;
                ctx.beginPath(); ctx.arc(-dir * 9, headY - 9, 3.5, 0, Math.PI*2); ctx.fill();
            }

            ctx.restore();
        }

        function drawFeedbacks() {
            ctx.save();
            for (let i = feedbacks.length - 1; i >= 0; i--) { const f = feedbacks[i]; ctx.globalAlpha = f.alpha; ctx.fillStyle = f.color || '#ffd700'; ctx.font = 'bold 13px monospace'; ctx.fillText(f.text, f.x, f.y); f.y += f.vy * deltaTime; f.alpha -= 0.012 * deltaTime; if (f.alpha <= 0) feedbacks.splice(i, 1); }
            ctx.globalAlpha = 1; ctx.restore();
        }

        
        
        
        let lastTime = performance.now(), deltaTime = 1;


        function gameLoop(currentTime) {
            
            deltaTime = (currentTime - lastTime) / (1000 / 60);
            lastTime = currentTime;
            deltaTime = Math.min(deltaTime, 3);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            updatePlayer();
             updateSpriteAnim(deltaTime / 60);
            updateCamera();
            updateDoorAnims();
            updateDoorLogic();

            
            const nearExit = getNearExitDoor();
            const nearAptDoor = getNearAptDoor();
            const nearDropped = getNearbyDroppedItem();
            const nearTex = getNearTexturedObject();

            if (!dialogueOpen) {
                if (nearExit) { pickupPromptEl.textContent = `🚪 Press E to exit ${nearExit.id.toUpperCase()}`; pickupPromptEl.classList.add('visible'); }
                else if (nearAptDoor) {
                    if (nearAptDoor.restricted) {
                        pickupPromptEl.textContent = 'Restricted Area!';
                    } else {
                        pickupPromptEl.textContent = nearAptDoor.isOpen ? `🚪 Press E to close door` : `🚪 Press E to open door`;
                    }
                    pickupPromptEl.classList.add('visible');
                }
                else if (nearDropped) { pickupPromptEl.textContent = `Press E to pick up ${nearDropped.label}`; pickupPromptEl.classList.add('visible'); }
                else if (nearTex) {
                    if (nearTex.isNote) pickupPromptEl.textContent = `Press E to read ${nearTex.label}`;
                    else if (nearTex.isLockbox) pickupPromptEl.textContent = `Press E to open ${nearTex.label}`;
                    else if (nearTex.IsPuzzleItem) pickupPromptEl.textContent = `Press E to pick up ${nearTex.label}`;
                    else pickupPromptEl.textContent = `Press E to inspect ${nearTex.label}`;
                    pickupPromptEl.classList.add('visible');
                }
                else { pickupPromptEl.classList.remove('visible'); }
            } else { pickupPromptEl.classList.remove('visible'); }

            const tx = canvas.width / 2 - camera.x * camera.zoom;
            const ty = canvas.height / 2 - camera.y * camera.zoom;
            ctx.save();
            ctx.setTransform(camera.zoom, 0, 0, camera.zoom, tx, ty);
            drawEnvironment();
            drawDroppedItems();
            drawTexturedObjects();
            drawPlayer();
            drawFeedbacks();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        
        requestAnimationFrame(gameLoop);
        loadInventory(); loadWorldItemState(); renderInventory();
    </script>
</body>
