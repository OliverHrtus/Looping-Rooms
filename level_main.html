const lbDigits = [0,0,0,0];
const lbNumEls = [
    document.getElementById('dn0'), document.getElementById('dn1'),
    document.getElementById('dn2'), document.getElementById('dn3'),
];
function lbChangeDigit(idx, dir) {
    lbDigits[idx] = (lbDigits[idx]+dir+10)%10;
    lbNumEls[idx].textContent = lbDigits[idx];
    const msg = document.getElementById('lb-msg'); msg.textContent=''; msg.className='lb-msg';
}
document.querySelectorAll('.digit-slot').forEach((slot,idx) => {
    const arrows = slot.querySelectorAll('.d-arrow');
    arrows[0].addEventListener('click', () => lbChangeDigit(idx,1));
    arrows[1].addEventListener('click', () => lbChangeDigit(idx,-1));
});
document.getElementById('lb-unlock-btn').addEventListener('click', () => {
    const msg = document.getElementById('lb-msg');
    if (lbDigits.join('') === LOCK_CODE) {
        msg.textContent='✓ Unlocked!'; msg.className='lb-msg success';
        document.getElementById('lb-icon').textContent='📭';
        if (currentLockbox) currentLockbox.unlocked = true;
        addToInventory({ id:'key_exit', icon:'🪪', texture:'assets/exit_card.png', label:'Exit Card', count:1 });
        setTimeout(closeLockbox, 1200);
    } else { msg.textContent='✗ Wrong code'; msg.className='lb-msg error'; }
});

const INVENTORY_SIZE = 5;
const inventory = Array(INVENTORY_SIZE).fill(null);
let activeSlot = 0;

function saveInventory() {
    const payload = JSON.stringify({ ts: Date.now(), slots: inventory });
    try { sessionStorage.setItem('looping_rooms_inventory', payload); } catch(e){}
    try { localStorage.setItem('looping_rooms_inventory', payload); } catch(e){}
}
function loadInventory() {
    let best = null;
    for (const store of [sessionStorage, localStorage]) {
        try { const raw = store.getItem('looping_rooms_inventory'); if(!raw) continue; const p=JSON.parse(raw); if(!best||p.ts>best.ts) best=p; } catch(e){}
    }
    if (!best) return;
    for (let i=0;i<INVENTORY_SIZE;i++) inventory[i]=best.slots[i]||null;
    renderInventory();
}
function addToInventory(item) {
    for (let i=0;i<INVENTORY_SIZE;i++) { if(inventory[i]&&inventory[i].id===item.id){inventory[i].count++;renderInventory();saveInventory();return true;} }
    for (let i=0;i<INVENTORY_SIZE;i++) { if(!inventory[i]){inventory[i]={...item,count:1};renderInventory();saveInventory();return true;} }
    return false;
}
let activeItemLabelTimer=null;
function renderInventory() {
    for (let i=0;i<INVENTORY_SIZE;i++) {
        document.getElementById(`slot-${i}`).classList.toggle('active',i===activeSlot);
        const iconSlot = document.getElementById(`icon-${i}`);
        iconSlot.innerHTML = '';
        
        if(inventory[i]) {
            const img = inventory[i].texture ? _texCache[inventory[i].texture] : null;
            if(img && img.complete && img.naturalWidth > 0) {
                const imgEl = document.createElement('img');
                imgEl.src = inventory[i].texture;
                iconSlot.appendChild(imgEl);
            } else {
                iconSlot.textContent = inventory[i].icon;
            }
        }
        document.getElementById(`count-${i}`).textContent=inventory[i]&&inventory[i].count>1?inventory[i].count:'';
    }
    const el=document.getElementById('active-item-label');
    clearTimeout(activeItemLabelTimer);
    if (inventory[activeSlot]) {
        const item=inventory[activeSlot];
        el.textContent=item.count>1?`${item.icon} ${item.label} x${item.count}`:`${item.icon} ${item.label}`;
        el.classList.add('visible');
        activeItemLabelTimer=setTimeout(()=>el.classList.remove('visible'),2500);
    } else { el.classList.remove('visible'); }
}
window.addEventListener('pagehide', () => {
    const inT=sessionStorage.getItem('looping_rooms_in_transition');
    if (!inT) { try{localStorage.removeItem('looping_rooms_inventory');}catch(e){} }
    try{sessionStorage.removeItem('looping_rooms_in_transition');}catch(e){}
});

}

const _texCache = {};
function loadTextures() {
    for (const obj of texturedObjects) {
        if (obj.texture && !_texCache[obj.texture]) {
            const img = new Image(); img.src = obj.texture; _texCache[obj.texture] = img;
        }
    }
}
loadTextures();

function drawSingleItem(item, bobY){
    const cx=item.x+item.width/2,cy=bobY+item.height/2;
    const img = item.texture ? _texCache[item.texture] : null;

    // Item Ambient Light Glow Ring
    const gc=item.isLockbox?(item.unlocked?'rgba(68,255,136,':'rgba(255,80,80,'):'rgba(255,215,0,';
    const grad=ctx.createRadialGradient(cx,cy,2,cx,cy,28);
    grad.addColorStop(0,gc+'0.35)');grad.addColorStop(1,gc+'0)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(cx,cy,28,0,Math.PI*2);ctx.fill();

    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, item.x, bobY, item.width, item.height);
    } else {
        // Fallback placeholder rendering styles
        if(item.isLockbox){
            ctx.fillStyle=item.unlocked?'#1a3a2a':'#2a1a1a';ctx.strokeStyle=item.unlocked?'#44ff88':'#ff5050';ctx.lineWidth=2;
            ctx.beginPath();ctx.roundRect(item.x,bobY,item.width,item.height,5);ctx.fill();ctx.stroke();
            ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(item.unlocked?'📭':'🔒',cx,cy);
        } else {
            ctx.font=`${item.width}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(item.icon || '❓',cx,cy);
        }
    }
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

function drawTexturedObjects() {
    const t = Date.now() / 600;
    texturedObjects.forEach((obj, idx) => {
        if (!obj.isNote && !obj.isLockbox && obj.collected) return;
        
        const inRoom = Object.entries(ROOMS).find(([id, r]) => obj.x + obj.width / 2 >= r.x && obj.x + obj.width / 2 <= r.x + r.w && obj.y + obj.height / 2 >= r.y && obj.y + obj.height / 2 <= r.y + r.h);
        if (inRoom && !roomVisible[inRoom[0]]) return;

        if (obj.IsPuzzleItem) {
            drawSingleItem(obj, obj.y + Math.sin(t + idx * 1.3) * 4);
        } else {
            const img = obj.texture ? _texCache[obj.texture] : null;
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, obj.x, obj.y, obj.width, obj.height);
            } else {
                ctx.fillStyle = '#2a2a3a'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                ctx.setLineDash([4,4]); ctx.strokeStyle='#6666aa'; ctx.lineWidth=2;
                ctx.strokeRect(obj.x+1, obj.y+1, obj.width-2, obj.height-2);
                ctx.setLineDash([]);
                ctx.font=(Math.min(obj.width,obj.height)*0.45)+'px serif';
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillStyle='rgba(180,180,220,0.5)';
                ctx.fillText(obj.icon || '\uD83D\uDDBC\uFE0F', obj.x+obj.width/2, obj.y+obj.height/2);
                ctx.textAlign='left'; ctx.textBaseline='alphabetic';
            }
        }

        const dx=(player.x+player.width/2)-(obj.x+obj.width/2);
        const dy=(player.y+player.height/2)-(obj.y+obj.height/2);
        if (Math.abs(dx)<70&&Math.abs(dy)<70) {
            ctx.strokeStyle='rgba(255,215,0,0.7)'; ctx.lineWidth=2; ctx.setLineDash([]);
            ctx.strokeRect(obj.x-2,obj.y-2,obj.width+4,obj.height+4);
        }
    });
}

function getTexturedObjectWalls() {
    return texturedObjects.filter(o=>o.solid && !o.collected).map(o=>({x:o.x,y:o.y,w:o.width,h:o.height}));
}
function getNearTexturedObject() {
    const reach=70;
    for (const obj of texturedObjects) {
        if (!obj.isNote && !obj.isLockbox && obj.collected) continue;
        const dx=(player.x+player.width/2)-(obj.x+obj.width/2);
        const dy=(player.y+player.height/2)-(obj.y+obj.height/2);
        if (Math.abs(dx)<reach&&Math.abs(dy)<reach) return obj;
    }
    return null;
}
