<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping Rooms - Exit</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', serif;
      overflow: hidden;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 25%, #0d0d0d 50%, #1a1a1a 75%, #000000 100%);
      position: relative;
    }

    h1 {
      font-size: 72px;
      color: #ffffff;
      margin: 20px 0;
      letter-spacing: 6px;
      text-shadow:
        0 0 20px rgba(255, 255, 255, 0.6),
        0 0 40px rgba(200, 200, 200, 0.4),
        2px 2px 4px rgba(0, 0, 0, 0.8);
      font-weight: bold;
      text-align: center;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(200, 200, 200, 0.08) 0%, transparent 50%);
      animation: glow 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes glow {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

   
</style>
<body>
    <h1>CONGRATULATIONS</h1>
    <h1>YOU ESCAPED!</h1>
</body>
</html>
