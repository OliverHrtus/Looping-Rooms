<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping Rooms</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .inv-slot {
            width: 56px;
            height: 56px;
            background: rgba(30, 30, 30, 0.85);
            border: 2px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: border-color 0.15s;
        }

        .inv-slot.active {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .inv-slot .slot-key {
            position: absolute;
            top: 3px;
            left: 5px;
            font-size: 10px;
            color: #888;
            font-family: monospace;
        }

        .inv-slot .item-icon {
            font-size: 26px;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .inv-slot .item-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .inv-slot .item-count {
            position: absolute;
            bottom: 3px;
            right: 5px;
            font-size: 11px;
            color: #fff;
            font-family: monospace;
            font-weight: bold;
        }

        #dialogue-panel {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: min(700px, 92vw);
            background: #000;
            border: 4px solid #fff;
            border-radius: 4px;
            padding: 18px 24px 16px 24px;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s, transform 0.15s;
            box-shadow: 0 0 0 2px #000, 0 0 0 6px #fff, 4px 6px 0 6px #000;
        }

        #dialogue-panel.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateX(-50%) translateY(0);
        }

        #dialogue-text {
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 26px;
            color: #fff;
            line-height: 1.45;
            min-height: 52px;
            white-space: pre-wrap;
            letter-spacing: 0.03em;
        }

        #dialogue-cursor {
            display: inline-block;
            width: 14px;
            height: 3px;
            background: #fff;
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 0.7s step-end infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0
            }
        }

        #dialogue-hint {
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 16px;
            color: #888;
            text-align: right;
            margin-top: 6px;
            letter-spacing: 0.05em;
        }

        #note-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background: #f5f0e8;
            border: 2px solid #c8b89a;
            border-radius: 4px;
            padding: 28px 32px;
            width: 320px;
            box-shadow: 6px 6px 24px rgba(0, 0, 0, 0.6);
            z-index: 20;
            display: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        #note-modal.open {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #note-modal h2 {
            margin: 0 0 14px 0;
            font-size: 14px;
            color: #888;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #note-modal p {
            margin: 0;
            font-size: 22px;
            color: #2a2a2a;
            font-family: Georgia, serif;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        #note-modal .close-hint {
            margin-top: 18px;
            font-size: 11px;
            color: #aaa;
            font-family: monospace;
            text-align: right;
        }

        #lockbox-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background: #1c1c1c;
            border: 3px solid #555;
            border-radius: 8px;
            padding: 30px 36px;
            width: 360px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            z-index: 20;
            display: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        #lockbox-modal.open {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #lockbox-modal h2 {
            margin: 0 0 4px 0;
            font-size: 13px;
            color: #888;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .box-icon {
            font-size: 42px;
            margin-bottom: 14px;
        }

        .digits {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 18px 0;
        }

        .digit-slot {
            width: 58px;
            height: 74px;
            background: #0a0a0a;
            border: 2px solid #444;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .d-arrow {
            width: 100%;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 13px;
            user-select: none;
            transition: color 0.1s, background 0.1s;
        }

        .d-arrow:hover {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.08);
        }

        .d-num {
            font-size: 30px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #fff;
            line-height: 1;
        }

        .lb-btn {
            margin-top: 4px;
            padding: 10px 32px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 6px;
            color: #ccc;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.15s;
        }

        .lb-btn:hover {
            background: #3a3a3a;
            border-color: #ffd700;
            color: #ffd700;
        }

        .lb-msg {
            margin-top: 12px;
            font-size: 13px;
            font-family: monospace;
            min-height: 18px;
            letter-spacing: 1px;
        }

        .lb-msg.error {
            color: #ff4444;
        }

        .lb-msg.success {
            color: #44ff88;
        }

        .lb-close-hint {
            margin-top: 12px;
            font-size: 11px;
            color: #444;
            font-family: monospace;
        }

        #pickup-prompt {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ffd700;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        #pickup-prompt.visible {
            opacity: 1;
        }

        #door-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(180, 30, 30, 0.92);
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 15;
            border: 1px solid #ff5555;
            white-space: nowrap;
        }

        #door-msg.visible {
            opacity: 1;
        }

        #fade-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 2s ease;
        }

        #fade-overlay.fading {
            opacity: 1;
            pointer-events: all;
        }

        #active-item-label {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ffd700;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        #active-item-label.visible {
            opacity: 1;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <div id="inventory">
        <div class="inv-slot active" id="slot-0"><span class="slot-key">1</span><span class="item-icon"
                id="icon-0"></span><span class="item-count" id="count-0"></span></div>
        <div class="inv-slot" id="slot-1"><span class="slot-key">2</span><span class="item-icon"
                id="icon-1"></span><span class="item-count" id="count-1"></span></div>
        <div class="inv-slot" id="slot-2"><span class="slot-key">3</span><span class="item-icon"
                id="icon-2"></span><span class="item-count" id="count-2"></span></div>
        <div class="inv-slot" id="slot-3"><span class="slot-key">4</span><span class="item-icon"
                id="icon-3"></span><span class="item-count" id="count-3"></span></div>
        <div class="inv-slot" id="slot-4"><span class="slot-key">5</span><span class="item-icon"
                id="icon-4"></span><span class="item-count" id="count-4"></span></div>
    </div>
    <div id="active-item-label"></div>
    <div id="pickup-prompt"></div>
    <div id="door-msg"></div>
    <div id="fade-overlay"></div>

    <div id="dialogue-panel">
        <div id="dialogue-text"></div>
        <div id="dialogue-hint">[ E / Z to continue ]</div>
    </div>

    <div id="note-modal">
        <h2 id="note-title"></h2>
        <p id="note-content"></p>
        <div class="close-hint">Press E or ESC to close</div>
    </div>

    <div id="lockbox-modal">
        <div class="box-icon" id="lb-icon">📦</div>
        <h2>Number Lock</h2>
        <div class="digits">
            <div class="digit-slot">
                <div class="d-arrow" id="up0">▲</div>
                <div class="d-num" id="dn0">0</div>
                <div class="d-arrow" id="ddn0">▼</div>
            </div>
            <div class="digit-slot">
                <div class="d-arrow" id="up1">▲</div>
                <div class="d-num" id="dn1">0</div>
                <div class="d-arrow" id="ddn1">▼</div>
            </div>
            <div class="digit-slot">
                <div class="d-arrow" id="up2">▲</div>
                <div class="d-num" id="dn2">0</div>
                <div class="d-arrow" id="ddn2">▼</div>
            </div>
            <div class="digit-slot">
                <div class="d-arrow" id="up3">▲</div>
                <div class="d-num" id="dn3">0</div>
                <div class="d-arrow" id="ddn3">▼</div>
            </div>
        </div>
        <button class="lb-btn" id="lb-unlock-btn">UNLOCK</button>
        <div class="lb-msg" id="lb-msg"></div>
        <div class="lb-close-hint">Press ESC to close</div>
    </div>

    <script>
        // ════════════════════════════════════════════════════════════
        // DIALOGUE SYSTEM
        // ════════════════════════════════════════════════════════════
        const dialoguePanel = document.getElementById('dialogue-panel');
        const dialogueText = document.getElementById('dialogue-text');
        const dialogueHint = document.getElementById('dialogue-hint');
        let dialogueOpen = false, dialoguePages = [], dialoguePage = 0;
        let typewriterTimer = null, typewriterDone = false, typewriterChars = 0;
        const TYPEWRITER_SPEED = 28;
        function openDialogue(pages) { if (!pages || !pages.length) return; dialoguePages = pages; dialoguePage = 0; dialogueOpen = true; dialoguePanel.classList.add('visible'); showPage(0); }
        function showPage(idx) { const text = dialoguePages[idx] || ''; dialogueText.textContent = ''; typewriterChars = 0; typewriterDone = false; clearInterval(typewriterTimer); const isLast = idx >= dialoguePages.length - 1; dialogueHint.textContent = isLast ? '[ E / Z  to close ]' : '[ E / Z  to continue ]'; typewriterTimer = setInterval(() => { typewriterChars++; dialogueText.textContent = text.slice(0, typewriterChars); if (typewriterChars >= text.length) { clearInterval(typewriterTimer); typewriterDone = true; const cursor = document.createElement('span'); cursor.id = 'dialogue-cursor'; dialogueText.appendChild(cursor); } }, TYPEWRITER_SPEED); }
        function advanceDialogue() { if (!dialogueOpen) return; if (!typewriterDone) { clearInterval(typewriterTimer); typewriterDone = true; dialogueText.textContent = dialoguePages[dialoguePage]; const cursor = document.createElement('span'); cursor.id = 'dialogue-cursor'; dialogueText.appendChild(cursor); return; } dialoguePage++; if (dialoguePage >= dialoguePages.length) { closeDialogue(); } else { showPage(dialoguePage); } }
        function closeDialogue() { clearInterval(typewriterTimer); dialogueOpen = false; dialoguePanel.classList.remove('visible'); dialogueText.textContent = ''; }

        // ════════════════════════════════════════════════════════════
        // WORLD LAYOUT
        // ════════════════════════════════════════════════════════════
        // World: 2200 x 1600
        // Corridor H: y=613..975,  Corridor V: x=925..1275
        // Apartments:
        //   NW: 0..925, 0..613
        //   NE: 1275..2200, 0..613
        //   SW: 0..925, 975..1600
        //   SE: 1275..2200, 975..1600
        //
        // Each apartment sub-rooms:
        //   NW: Bathroom(blue) 0..462,0..300 | Bedroom(green) 462..925,0..300 | Living(yellow) 0..925,300..613
        //   NE: Bedroom(green) 1275..1737,0..300 | Bathroom(blue) 1737..2200,0..300 | Living 1275..2200,300..613
        //   SW: Living 0..925,975..1287 | Bathroom(blue) 0..462,1287..1600 | Bedroom(green) 462..925,1287..1600
        //   SE: Living 1275..2200,975..1287 | Bedroom(green) 1275..1737,1287..1600 | Bathroom(blue) 1737..2200,1287..1600

        const W = 2200, H = 1600;
        const CORR_Y1 = 613, CORR_Y2 = 975, CORR_X1 = 925, CORR_X2 = 1275;
        // Sub-room splits
        const NW_SPLIT_X = 462, NW_SPLIT_Y = 300;
        const NE_SPLIT_X = 1737, NE_SPLIT_Y = 300;
        const SW_SPLIT_X = 462, SW_SPLIT_Y = 1287;
        const SE_SPLIT_X = 1737, SE_SPLIT_Y = 1287;

        // Door opening width and position
        const DOOR_W = 12, DOOR_OPENING = 130;

        // Apartment entrance doors — positioned in the living room section of each corridor wall
        // NW/NE: apt height 0..613, living room is y=300..613, so door center ≈ y=430 (midpoint of living wall)
        // SW/SE: apt height 975..1600, living room is y=975..1287, so door center ≈ y=1131
        const NW_NE_DOOR_CENTER = 430; // center of living room wall (N apts)
        const SW_SE_DOOR_CENTER = 1131; // center of living room wall (S apts)

        const APT_DOORS = [
            // NW apt: east wall at x=925, door in living room section
            { id: 'door_NW', aptId: 'NW', x: CORR_X1 - DOOR_W, y: NW_NE_DOOR_CENTER - DOOR_OPENING / 2, w: DOOR_W, h: DOOR_OPENING, side: 'east', openAnim: 0, isOpen: false },
            // NE apt: west wall at x=1275
            { id: 'door_NE', aptId: 'NE', x: CORR_X2, y: NW_NE_DOOR_CENTER - DOOR_OPENING / 2, w: DOOR_W, h: DOOR_OPENING, side: 'west', openAnim: 0, isOpen: false },
            // SW apt: east wall at x=925, door in living room section
            { id: 'door_SW', aptId: 'SW', x: CORR_X1 - DOOR_W, y: SW_SE_DOOR_CENTER - DOOR_OPENING / 2, w: DOOR_W, h: DOOR_OPENING, side: 'east', openAnim: 0, isOpen: false },
            // SE apt: west wall at x=1275
            { id: 'door_SE', aptId: 'SE', x: CORR_X2, y: SW_SE_DOOR_CENTER - DOOR_OPENING / 2, w: DOOR_W, h: DOOR_OPENING, side: 'west', openAnim: 0, isOpen: false },
        ];

        // Exit doors (level transitions)
        const exitDoors = [
            { id: 'north', x: 1060, y: 0, w: 80, h: 20, label: 'N' },
            { id: 'exit', x: 1060, y: 1580, w: 80, h: 20, label: 'E' },
            { id: 'west', x: 0, y: 760, w: 20, h: 80, label: 'W' },
            { id: 'east', x: 2180, y: 760, w: 20, h: 80, label: 'E' },
        ];

        // ════════════════════════════════════════════════════════════
        // LOCKBOX
        // ════════════════════════════════════════════════════════════
        const LOCK_CODE = '6658';
        const lbDigits = [0, 0, 0, 0];
        const lbNumEls = [document.getElementById('dn0'), document.getElementById('dn1'), document.getElementById('dn2'), document.getElementById('dn3')];
        function lbChangeDigit(idx, dir) { lbDigits[idx] = (lbDigits[idx] + dir + 10) % 10; lbNumEls[idx].textContent = lbDigits[idx]; const msg = document.getElementById('lb-msg'); msg.textContent = ''; msg.className = 'lb-msg'; }
        document.querySelectorAll('.digit-slot').forEach((slot, idx) => { const arrows = slot.querySelectorAll('.d-arrow'); arrows[0].addEventListener('click', () => lbChangeDigit(idx, 1)); arrows[1].addEventListener('click', () => lbChangeDigit(idx, -1)); });
        document.getElementById('lb-unlock-btn').addEventListener('click', () => { const msg = document.getElementById('lb-msg'); if (lbDigits.join('') === LOCK_CODE) { msg.textContent = '✓ Unlocked!'; msg.className = 'lb-msg success'; document.getElementById('lb-icon').textContent = '📭'; if (currentLockbox) currentLockbox.unlocked = true; addToInventory({ id: 'key_exit', icon: '🪪', texture: 'assets/exit_card.png', label: 'Exit Card', count: 1 }); setTimeout(closeLockbox, 1200); } else { msg.textContent = '✗ Wrong code'; msg.className = 'lb-msg error'; } });

        // ════════════════════════════════════════════════════════════
        // INVENTORY
        // ════════════════════════════════════════════════════════════
        const INVENTORY_SIZE = 5;
        const inventory = Array(INVENTORY_SIZE).fill(null);
        let activeSlot = 0;
        function saveInventory() { const payload = JSON.stringify({ ts: Date.now(), slots: inventory }); try { sessionStorage.setItem('looping_rooms_inventory', payload); } catch (e) { } try { localStorage.setItem('looping_rooms_inventory', payload); } catch (e) { } }
        function loadInventory() { let best = null; for (const store of [sessionStorage, localStorage]) { try { const raw = store.getItem('looping_rooms_inventory'); if (!raw) continue; const p = JSON.parse(raw); if (!best || p.ts > best.ts) best = p; } catch (e) { } } if (!best) return; for (let i = 0; i < INVENTORY_SIZE; i++)inventory[i] = best.slots[i] || null; renderInventory(); }
        function addToInventory(item) { for (let i = 0; i < INVENTORY_SIZE; i++) { if (inventory[i] && inventory[i].id === item.id) { inventory[i].count++; renderInventory(); saveInventory(); return true; } } for (let i = 0; i < INVENTORY_SIZE; i++) { if (!inventory[i]) { inventory[i] = { ...item, count: 1 }; renderInventory(); saveInventory(); return true; } } return false; }
        let activeItemLabelTimer = null;
        function renderInventory() { for (let i = 0; i < INVENTORY_SIZE; i++) { document.getElementById(`slot-${i}`).classList.toggle('active', i === activeSlot); const iconSlot = document.getElementById(`icon-${i}`); iconSlot.innerHTML = ''; if (inventory[i]) { const img = inventory[i].texture ? _texCache[inventory[i].texture] : null; if (img && img.complete && img.naturalWidth > 0) { const imgEl = document.createElement('img'); imgEl.src = inventory[i].texture; iconSlot.appendChild(imgEl); } else { iconSlot.textContent = inventory[i].icon; } } document.getElementById(`count-${i}`).textContent = inventory[i] && inventory[i].count > 1 ? inventory[i].count : ''; } const el = document.getElementById('active-item-label'); clearTimeout(activeItemLabelTimer); if (inventory[activeSlot]) { const item = inventory[activeSlot]; el.textContent = item.count > 1 ? `${item.icon} ${item.label} x${item.count}` : `${item.icon} ${item.label}`; el.classList.add('visible'); activeItemLabelTimer = setTimeout(() => el.classList.remove('visible'), 2500); } else { el.classList.remove('visible'); } }

        // ════════════════════════════════════════════════════════════
        // CANVAS & GAME OBJECTS
        // ════════════════════════════════════════════════════════════
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        const texturedObjects = [
            { id: 'textured_obj_1', x: 1400, y: 630, width: 64, height: 64, texture: 'assets/machine.png', icon: '🤖', label: 'Strange Machine', solid: true, dialogue: ['* A humming machine of unknown purpose.', '* Buttons line its face, none labelled.', '* You decide not to press anything.'] },
            { id: 'textured_obj_2', x: 800, y: 920, width: 80, height: 40, texture: 'assets/rug.png', icon: '🧶', label: 'Old Rug', solid: false, dialogue: ['* An old rug, moth-eaten and dusty.', '* Nothing underneath but cold floor.'] },
            // NW apt items
            { id: 'note_1', texture: 'assets/note.png', icon: '📝', label: 'Note #1', x: 200, y: 150, width: 40, height: 40, collected: false, isNote: true, noteTitle: 'Note #1', noteContent: '6', IsPuzzleItem: true, dialogue: ['* A crumpled piece of paper.', '* The number 6 is written on it.'] },
            { id: 'key_west', texture: 'assets/key.png', icon: '🔑', label: 'West Key', x: 300, y: 450, width: 35, height: 35, collected: false, isDoorKey: true, doorId: 'west', IsPuzzleItem: true, dialogue: ['* A small key.', '* It might open the door to the west.'] },
            // NE apt items
            { id: 'note_2', texture: 'assets/note.png', icon: '📝', label: 'Note #2', x: 1500, y: 150, width: 40, height: 40, collected: false, isNote: true, noteTitle: 'Note #2', noteContent: '6', IsPuzzleItem: true, dialogue: ['* Another note.', '* The number 6 again...'] },
            { id: 'key_north', texture: 'assets/key.png', icon: '🔑', label: 'North Key', x: 1900, y: 150, width: 28, height: 28, collected: false, isDoorKey: true, doorId: 'north', IsPuzzleItem: true, dialogue: ['* A cold metal key.', '* For the north exit.'] },
            // SW apt item
            { id: 'note_3', texture: 'assets/note.png', icon: '📝', label: 'Note #3', x: 200, y: 1100, width: 40, height: 40, collected: false, isNote: true, noteTitle: 'Note #3', noteContent: '5', IsPuzzleItem: true, dialogue: ['* A damp note.', '* The number 5 is barely readable.'] },
            // SE apt item
            { id: 'note_4', texture: 'assets/note.png', icon: '📝', label: 'Note #4', x: 1700, y: 1100, width: 40, height: 40, collected: false, isNote: true, noteTitle: 'Note #4', noteContent: '8', IsPuzzleItem: true, dialogue: ['* The last note.', '* The number 8 stares back at you.'] },
            // Corridor center lockbox

            ctx.strokeStyle = 'rgba(80,150,80,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(NW_SPLIT_X, 0, CORR_X1 - NW_SPLIT_X, NW_SPLIT_Y);
            drawRoomLabel('BEDROOM', NW_SPLIT_X, 0, CORR_X1 - NW_SPLIT_X, NW_SPLIT_Y, 'rgba(60,130,60,0.35)');
            // Living room (bottom)
            drawCheckerboard(0, NW_SPLIT_Y, CORR_X1, CORR_Y1 - NW_SPLIT_Y, '#f4f4f4', '#e0e0e0', T);
            ctx.strokeStyle = 'rgba(120,120,120,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(0, NW_SPLIT_Y, CORR_X1, CORR_Y1 - NW_SPLIT_Y);
            drawRoomLabel('LIVING ROOM', 0, NW_SPLIT_Y, CORR_X1, CORR_Y1 - NW_SPLIT_Y, 'rgba(80,80,80,0.35)');

            // ── NE APARTMENT ──
            // Bedroom (top-left)
            drawCheckerboard(CORR_X2, 0, NE_SPLIT_X - CORR_X2, NE_SPLIT_Y, '#eaf4ea', '#c8e8c8', T);
            ctx.strokeStyle = 'rgba(80,150,80,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(CORR_X2, 0, NE_SPLIT_X - CORR_X2, NE_SPLIT_Y);
            drawRoomLabel('BEDROOM', CORR_X2, 0, NE_SPLIT_X - CORR_X2, NE_SPLIT_Y, 'rgba(60,130,60,0.35)');
            // Bathroom (top-right)
            drawCheckerboard(NE_SPLIT_X, 0, W - NE_SPLIT_X, NE_SPLIT_Y, '#e8eef4', '#c8d8e8', T);
            ctx.strokeStyle = 'rgba(100,140,180,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(NE_SPLIT_X, 0, W - NE_SPLIT_X, NE_SPLIT_Y);
            drawRoomLabel('BATHROOM', NE_SPLIT_X, 0, W - NE_SPLIT_X, NE_SPLIT_Y, 'rgba(80,120,160,0.35)');
            // Living room (bottom)
            drawCheckerboard(CORR_X2, NE_SPLIT_Y, W - CORR_X2, CORR_Y1 - NE_SPLIT_Y, '#f4f4f4', '#e0e0e0', T);
            ctx.strokeStyle = 'rgba(120,120,120,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(CORR_X2, NE_SPLIT_Y, W - CORR_X2, CORR_Y1 - NE_SPLIT_Y);
            drawRoomLabel('LIVING ROOM', CORR_X2, NE_SPLIT_Y, W - CORR_X2, CORR_Y1 - NE_SPLIT_Y, 'rgba(80,80,80,0.35)');

            // ── SW APARTMENT ──
            // Living room (top)
            drawCheckerboard(0, CORR_Y2, CORR_X1, SW_SPLIT_Y - CORR_Y2, '#f4f4f4', '#e0e0e0', T);
            ctx.strokeStyle = 'rgba(120,120,120,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(0, CORR_Y2, CORR_X1, SW_SPLIT_Y - CORR_Y2);
            drawRoomLabel('LIVING ROOM', 0, CORR_Y2, CORR_X1, SW_SPLIT_Y - CORR_Y2, 'rgba(80,80,80,0.35)');
            // Bathroom (bottom-left)
            drawCheckerboard(0, SW_SPLIT_Y, SW_SPLIT_X, H - SW_SPLIT_Y, '#e8eef4', '#c8d8e8', T);
            ctx.strokeStyle = 'rgba(100,140,180,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(0, SW_SPLIT_Y, SW_SPLIT_X, H - SW_SPLIT_Y);
            drawRoomLabel('BATHROOM', 0, SW_SPLIT_Y, SW_SPLIT_X, H - SW_SPLIT_Y, 'rgba(80,120,160,0.35)');
            // Bedroom (bottom-right)
            drawCheckerboard(SW_SPLIT_X, SW_SPLIT_Y, CORR_X1 - SW_SPLIT_X, H - SW_SPLIT_Y, '#eaf4ea', '#c8e8c8', T);
            ctx.strokeStyle = 'rgba(80,150,80,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(SW_SPLIT_X, SW_SPLIT_Y, CORR_X1 - SW_SPLIT_X, H - SW_SPLIT_Y);
            drawRoomLabel('BEDROOM', SW_SPLIT_X, SW_SPLIT_Y, CORR_X1 - SW_SPLIT_X, H - SW_SPLIT_Y, 'rgba(60,130,60,0.35)');

            // ── SE APARTMENT ──
            // Living room (top)
            drawCheckerboard(CORR_X2, CORR_Y2, W - CORR_X2, SE_SPLIT_Y - CORR_Y2, '#f4f4f4', '#e0e0e0', T);
            ctx.strokeStyle = 'rgba(120,120,120,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(CORR_X2, CORR_Y2, W - CORR_X2, SE_SPLIT_Y - CORR_Y2);
            drawRoomLabel('LIVING ROOM', CORR_X2, CORR_Y2, W - CORR_X2, SE_SPLIT_Y - CORR_Y2, 'rgba(80,80,80,0.35)');
            // Bedroom (bottom-left)
            drawCheckerboard(CORR_X2, SE_SPLIT_Y, SE_SPLIT_X - CORR_X2, H - SE_SPLIT_Y, '#eaf4ea', '#c8e8c8', T);
            ctx.strokeStyle = 'rgba(80,150,80,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(CORR_X2, SE_SPLIT_Y, SE_SPLIT_X - CORR_X2, H - SE_SPLIT_Y);
            drawRoomLabel('BEDROOM', CORR_X2, SE_SPLIT_Y, SE_SPLIT_X - CORR_X2, H - SE_SPLIT_Y, 'rgba(60,130,60,0.35)');
            // Bathroom (bottom-right)
            drawCheckerboard(SE_SPLIT_X, SE_SPLIT_Y, W - SE_SPLIT_X, H - SE_SPLIT_Y, '#e8eef4', '#c8d8e8', T);
            ctx.strokeStyle = 'rgba(100,140,180,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(SE_SPLIT_X, SE_SPLIT_Y, W - SE_SPLIT_X, H - SE_SPLIT_Y);
            drawRoomLabel('BATHROOM', SE_SPLIT_X, SE_SPLIT_Y, W - SE_SPLIT_X, H - SE_SPLIT_Y, 'rgba(80,120,160,0.35)');

            // ── OUTER WALLS (thick black) ──
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, W, W12);           // top
            ctx.fillRect(0, H - W12, W, W12);       // bottom
            ctx.fillRect(0, 0, W12, H);           // left
            ctx.fillRect(W - W12, 0, W12, H);       // right

            // ── INTERNAL APT WALLS (drawn visually) ──
            const wallColor = '#222';
            const wallGlow = 'rgba(255,255,255,0.15)';
            const WT = 10;

            // Vertical dividers: SOLID (no opening between bedroom & bathroom)
            ctx.fillStyle = wallColor;
            ctx.fillRect(NW_SPLIT_X, 0, WT, NW_SPLIT_Y);
            ctx.fillRect(NE_SPLIT_X, 0, WT, NE_SPLIT_Y);
            ctx.fillRect(SW_SPLIT_X, SW_SPLIT_Y, WT, H - SW_SPLIT_Y);
            ctx.fillRect(SE_SPLIT_X, SE_SPLIT_Y, WT, H - SE_SPLIT_Y);

            // Horizontal dividers: two openings (one into each sub-room), 180px each
            drawWallWithOpening2('horizontal', 0, NW_SPLIT_Y, CORR_X1, NW_SPLIT_X / 2, NW_SPLIT_X + (CORR_X1 - NW_SPLIT_X) / 2, 180, wallColor, wallGlow);
            drawWallWithOpening2('horizontal', CORR_X2, NE_SPLIT_Y, W, CORR_X2 + (NE_SPLIT_X - CORR_X2) / 2, NE_SPLIT_X + (W - NE_SPLIT_X) / 2, 180, wallColor, wallGlow);
            drawWallWithOpening2('horizontal', 0, SW_SPLIT_Y, CORR_X1, SW_SPLIT_X / 2, SW_SPLIT_X + (CORR_X1 - SW_SPLIT_X) / 2, 180, wallColor, wallGlow);
            drawWallWithOpening2('horizontal', CORR_X2, SE_SPLIT_Y, W, CORR_X2 + (SE_SPLIT_X - CORR_X2) / 2, SE_SPLIT_X + (W - SE_SPLIT_X) / 2, 180, wallColor, wallGlow);

            // ── VISUAL LIVING ROOM EDGE WALLS (match physics walls)
            // Top living-room edges (NW & NE) at y = CORR_Y1
            ctx.fillStyle = wallColor; ctx.fillRect(0, CORR_Y1 - W12, CORR_X1, W12);
            ctx.fillStyle = wallColor; ctx.fillRect(CORR_X2, CORR_Y1 - W12, W - CORR_X2, W12);
            // Bottom living-room edges (SW & SE) at y = CORR_Y2
            ctx.fillStyle = wallColor; ctx.fillRect(0, CORR_Y2, CORR_X1, W12);
            ctx.fillStyle = wallColor; ctx.fillRect(CORR_X2, CORR_Y2, W - CORR_X2, W12);

            // ── APT CORRIDOR WALLS (with doors) ──
            drawAptWall(CORR_X1 - W12, 0, CORR_Y1, APT_DOORS.find(d => d.aptId === 'NW')); // NW east
            drawAptWall(CORR_X2, 0, CORR_Y1, APT_DOORS.find(d => d.aptId === 'NE'));      // NE west
            drawAptWall(CORR_X1 - W12, CORR_Y2, H, APT_DOORS.find(d => d.aptId === 'SW')); // SW east
            drawAptWall(CORR_X2, CORR_Y2, H, APT_DOORS.find(d => d.aptId === 'SE'));      // SE west

            // ── EXIT DOORS ──
            exitDoors.forEach(d => {
                const hasKey = inventory.some(s => s && (s.id === 'key_' + d.id || s.baseId === 'key_' + d.id));
                const cx = d.x + d.w / 2, cy = d.y + d.h / 2;
                ctx.fillStyle = hasKey ? '#1a2e1a' : '#2e1a1a'; ctx.fillRect(d.x, d.y, d.w, d.h);
                ctx.shadowColor = hasKey ? '#44ff66' : '#ff4444'; ctx.shadowBlur = 14;
                ctx.strokeStyle = hasKey ? '#44cc55' : '#cc4444'; ctx.lineWidth = 3; ctx.strokeRect(d.x, d.y, d.w, d.h);
                ctx.shadowBlur = 0; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = hasKey ? '#aaffbb' : '#ffaaaa';
                ctx.fillText(hasKey ? '🔓' : '🔒', cx, cy - 6); ctx.font = 'bold 9px monospace'; ctx.fillText(d.label, cx, cy + 7);
                ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            });
        }

        function drawWallWithOpening(dir, x1, y1, x2, center, opening, color, glowColor) {
            const T = 10; // wall thickness
            const half = opening / 2;
            const openStart = center - half, openEnd = center + half;
            ctx.fillStyle = color || '#222';
            if (glowColor) { ctx.shadowColor = glowColor; ctx.shadowBlur = 6; }
            if (dir === 'horizontal') {
                if (openStart > x1) ctx.fillRect(x1, y1, openStart - x1, T);
                if (openEnd < x2) ctx.fillRect(openEnd, y1, x2 - openEnd, T);
            } else {
                if (openStart > y1) ctx.fillRect(x1, y1, T, openStart - y1);
                if (openEnd < x2) ctx.fillRect(x1, openEnd, T, x2 - openEnd);
            }
            ctx.shadowBlur = 0;
        }

        function drawWallWithOpening2(dir, x1, y1, x2, center1, center2, opening, color, glowColor) {
            const T = 10, half = opening / 2;
            const o1s = center1 - half, o1e = center1 + half;
            const o2s = center2 - half, o2e = center2 + half;
            ctx.fillStyle = color || '#222';
            if (glowColor) { ctx.shadowColor = glowColor; ctx.shadowBlur = 6; }
            if (o1s > x1) ctx.fillRect(x1, y1, o1s - x1, T);
            if (o2s > o1e) ctx.fillRect(o1e, y1, o2s - o1e, T);
            if (o2e < x2) ctx.fillRect(o2e, y1, x2 - o2e, T);
            ctx.shadowBlur = 0;
        }

        function drawAptWall(wallX, wallY1, wallY2, door) {
            // Solid wall with door gap and animated door panels
            ctx.fillStyle = '#1a1a1a';
            const dY = door.y, dH = door.h;
            // Sections above and below door
            if (dY > wallY1) ctx.fillRect(wallX, wallY1, W12, dY - wallY1);
            if (dY + dH < wallY2) ctx.fillRect(wallX, dY + dH, W12, wallY2 - (dY + dH));
            // Door panels
            const anim = door.openAnim;
            if (anim < 1) {
                const mid = dY + dH / 2, halfH = (dH / 2) * (1 - anim);
                ctx.shadowColor = '#7755cc'; ctx.shadowBlur = 12 * (1 - anim);
                ctx.fillStyle = `rgba(100,60,180,${0.9 - anim * 0.8})`;
                if (halfH > 0.5) {
                    ctx.fillRect(wallX, dY, W12, halfH);
                    ctx.fillRect(wallX, mid + (dH / 2) * anim, W12, halfH);
                }
                ctx.strokeStyle = `rgba(180,120,255,${1 - anim})`; ctx.lineWidth = 1.5;
                if (halfH > 0.5) {
                    ctx.strokeRect(wallX, dY, W12, halfH);
                    ctx.strokeRect(wallX, mid + (dH / 2) * anim, W12, halfH);
                }
                ctx.shadowBlur = 0;
            }
            // Door frame outline
            ctx.strokeStyle = `rgba(160,100,255,${0.5 * (1 - anim) + 0.1})`; ctx.lineWidth = 2;
            ctx.strokeRect(wallX - 1, dY, W12 + 2, dH);
        }

        function drawSingleItem(item, bobY) {
            const cx = item.x + item.width / 2, cy = bobY + item.height / 2;
            const img = item.texture ? _texCache[item.texture] : null;
            const gc = item.isLockbox ? (item.unlocked ? 'rgba(68,255,136,' : 'rgba(255,80,80,') : 'rgba(255,215,0,';
            const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 28);
            grad.addColorStop(0, gc + '0.35)'); grad.addColorStop(1, gc + '0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.fill();
            if (img && img.complete && img.naturalWidth > 0) { ctx.drawImage(img, item.x, bobY, item.width, item.height); }
            else { if (item.isLockbox) { ctx.fillStyle = item.unlocked ? '#1a3a2a' : '#2a1a1a'; ctx.strokeStyle = item.unlocked ? '#44ff88' : '#ff5050'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(item.x, bobY, item.width, item.height, 5); ctx.fill(); ctx.stroke(); ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(item.unlocked ? '📭' : '🔒', cx, cy); } else { ctx.font = `${item.width}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(item.icon || '❓', cx, cy); } }
            ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            // Proximity highlight
            const dx = (player.x + player.width / 2) - (item.x + item.width / 2);
            const dy = (player.y + player.height / 2) - (item.y + item.height / 2);
            if (Math.abs(dx) < 70 && Math.abs(dy) < 70) { ctx.strokeStyle = 'rgba(255,215,0,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([]); ctx.strokeRect(item.x - 2, bobY - 2, item.width + 4, item.height + 4); }
        }

        function drawTexturedObjects() {
            const t = Date.now() / 600;
            texturedObjects.forEach((obj, idx) => {
                if (!obj.isNote && !obj.isLockbox && obj.collected) return;
                if (obj.IsPuzzleItem) { drawSingleItem(obj, obj.y + Math.sin(t + idx * 1.3) * 4); }
                else {
                    const img = obj.texture ? _texCache[obj.texture] : null;
                    if (img && img.complete && img.naturalWidth > 0) { ctx.drawImage(img, obj.x, obj.y, obj.width, obj.height); }
                    else { ctx.fillStyle = '#2a2a3a'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height); ctx.setLineDash([4, 4]); ctx.strokeStyle = '#6666aa'; ctx.lineWidth = 2; ctx.strokeRect(obj.x + 1, obj.y + 1, obj.width - 2, obj.height - 2); ctx.setLineDash([]); ctx.font = (Math.min(obj.width, obj.height) * 0.45) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(180,180,220,0.5)'; ctx.fillText(obj.icon || '🖼️', obj.x + obj.width / 2, obj.y + obj.height / 2); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; }
                }
            });
        }

        function drawDroppedItems() {
            const t = Date.now() / 600;
            droppedItems.forEach((item, idx) => { if (item.collected) return; ctx.globalAlpha = 0.88; drawSingleItem(item, item.y + Math.sin(t + idx * 2.1 + 99) * 3); ctx.globalAlpha = 1; });
        }

        function drawPlayer() {
            const cx = player.x + player.width / 2, cy = player.y + player.height / 2;
            ctx.fillStyle = '#e05555'; ctx.beginPath(); ctx.arc(cx, cy, player.width / 2, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#ff8888'; ctx.lineWidth = 2; ctx.stroke();
        }

        function drawFeedbacks() {
            ctx.save();
            for (let i = feedbacks.length - 1; i >= 0; i--) { const f = feedbacks[i]; ctx.globalAlpha = f.alpha; ctx.fillStyle = f.color || '#ffd700'; ctx.font = 'bold 13px monospace'; ctx.fillText(f.text, f.x, f.y); f.y += f.vy * deltaTime; f.alpha -= 0.012 * deltaTime; if (f.alpha <= 0) feedbacks.splice(i, 1); }
            ctx.globalAlpha = 1; ctx.restore();
        }

        // ════════════════════════════════════════════════════════════
        // GAME LOOP
        // ════════════════════════════════════════════════════════════
        let lastTime = performance.now(), deltaTime = 1;

        function gameLoop(currentTime) {
            deltaTime = (currentTime - lastTime) / (1000 / 60);
            lastTime = currentTime;
            deltaTime = Math.min(deltaTime, 3);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            updatePlayer();
            updateCamera();
            updateDoorAnims();
            updateDoorLogic();

            // Prompt
            const nearExit = getNearExitDoor();
            const nearAptDoor = getNearAptDoor();
            const nearDropped = getNearbyDroppedItem();
            const nearTex = getNearTexturedObject();

            if (!dialogueOpen) {
                if (nearExit) { pickupPromptEl.textContent = `🚪 Press E to exit ${nearExit.id.toUpperCase()}`; pickupPromptEl.classList.add('visible'); }
                else if (nearAptDoor) { pickupPromptEl.textContent = nearAptDoor.isOpen ? `🚪 Press E to close door` : `🚪 Press E to open door`; pickupPromptEl.classList.add('visible'); }
                else if (nearDropped) { pickupPromptEl.textContent = `Press E to pick up ${nearDropped.label}`; pickupPromptEl.classList.add('visible'); }
                else if (nearTex) {
                    if (nearTex.isNote) pickupPromptEl.textContent = `Press E to read ${nearTex.label}`;
                    else if (nearTex.isLockbox) pickupPromptEl.textContent = `Press E to open ${nearTex.label}`;
                    else if (nearTex.IsPuzzleItem) pickupPromptEl.textContent = `Press E to pick up ${nearTex.label}`;
                    else pickupPromptEl.textContent = `Press E to inspect ${nearTex.label}`;
                    pickupPromptEl.classList.add('visible');
                }
                else { pickupPromptEl.classList.remove('visible'); }
            } else { pickupPromptEl.classList.remove('visible'); }

            const tx = canvas.width / 2 - camera.x * camera.zoom;
            const ty = canvas.height / 2 - camera.y * camera.zoom;
            ctx.save();
            ctx.setTransform(camera.zoom, 0, 0, camera.zoom, tx, ty);
            drawEnvironment();
            drawDroppedItems();
            drawTexturedObjects();
            drawPlayer();
            drawFeedbacks();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
        loadInventory(); loadWorldItemState(); renderInventory();
    </script>
