<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looping Rooms - Main Menu</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', serif;
      overflow: hidden;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 25%, #0d0d0d 50%, #1a1a1a 75%, #000000 100%);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(200, 200, 200, 0.08) 0%, transparent 50%);
      animation: glow 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes glow {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    .container {
      text-align: center;
      z-index: 1;
      position: relative;
    }

    .title-wrapper {
      margin-bottom: 60px;
      position: relative;
    }

    .decorative-top {
      font-size: 48px;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: 8px;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
    }

    h1 {
      font-size: 72px;
      color: #ffffff;
      margin: 20px 0;
      letter-spacing: 6px;
      text-shadow:
        0 0 20px rgba(255, 255, 255, 0.6),
        0 0 40px rgba(200, 200, 200, 0.4),
        2px 2px 4px rgba(0, 0, 0, 0.8);
      font-weight: bold;
    }

    .decorative-bottom {
      font-size: 48px;
      color: #ffffff;
      margin-top: 10px;
      letter-spacing: 8px;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
    }

    .menu-button {
      padding: 15px 50px;
      font-size: 16px;
      font-family: 'Georgia', serif;
      color: #ffffff;
      border: 2px solid #ffffff;
      background: rgba(50, 50, 50, 0.7);
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      position: relative;
      overflow: visible;
      text-transform: uppercase;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .menu-button::before {
      content: '✦';
      position: absolute;
      left: 15px;
      opacity: 0;
      transform: translateX(-15px);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 20px;
      letter-spacing: 0;
    }

    .menu-button::after {
      content: '✦';
      position: absolute;
      right: 15px;
      opacity: 0;
      transform: translateX(15px);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 20px;
      letter-spacing: 0;
    }

    .menu-button:hover::before {
      opacity: 1;
      transform: translateX(0);
    }

    .menu-button:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    .menu-button:hover {
      background: linear-gradient(135deg,
          rgba(200, 200, 200, 0.4) 0%,
          rgba(150, 150, 150, 0.4) 50%,
          rgba(200, 200, 200, 0.2) 100%);
      color: #000000;
      border-color: #ffffff;
      box-shadow:
        0 0 15px rgba(255, 255, 255, 0.6),
        0 0 30px rgba(200, 200, 200, 0.3),
        inset 0 0 15px rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .menu-button:active {
      transform: scale(0.98);
    }

    .footer {
      position: fixed;
      bottom: 20px;
      right: 30px;
      color: #cccccc;
      font-size: 14px;
      z-index: 1;
    }

    .version {
      position: fixed;
      bottom: 20px;
      left: 30px;
      color: #cccccc;
      font-size: 14px;
      z-index: 1;
    }

    
    #controls-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #controls-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    
    #controls-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.88);
      width: 480px;
      background: #0d0d0d;
      border: 2px solid #ffffff;
      box-shadow:
        0 0 0 1px #000,
        0 0 30px rgba(255, 255, 255, 0.15),
        inset 0 0 40px rgba(255, 255, 255, 0.03);
      z-index: 51;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #controls-modal.open {
      opacity: 1;
      pointer-events: all;
      transform: translate(-50%, -50%) scale(1);
    }

    
    .modal-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid #333;
      background: rgba(255, 255, 255, 0.05);
    }

    .modal-titlebar span {
      font-family: 'Georgia', serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ccc;
    }

    .modal-close {
      background: none;
      border: 1px solid #555;
      color: #aaa;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-family: monospace;
    }

    .modal-close:hover {
      border-color: #fff;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    
    .modal-body {
      padding: 28px 32px 32px;
    }

    .controls-section {
      margin-bottom: 24px;
    }

    .controls-section:last-child {
      margin-bottom: 0;
    }

    .controls-section-title {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #666;
      font-family: monospace;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #222;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
    }

    .control-label {
      font-family: 'Georgia', serif;
      font-size: 14px;
      color: #bbb;
    }

    .control-keys {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 28px;
      padding: 0 8px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-bottom: 3px solid #333;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      color: #ddd;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .key-sep {
      color: #555;
      font-size: 11px;
      font-family: monospace;
    }

    .modal-footer {
      padding: 12px 32px;
      border-top: 1px solid #1e1e1e;
      text-align: right;
    }

    .modal-footer span {
      font-size: 11px;
      color: #444;
      font-family: monospace;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="title-wrapper">
      <div class="decorative-top">✦ ✧ ◆ ✧ ✦</div>
      <h1>LOOPING ROOMS</h1>
      <div class="decorative-bottom">✦ ◆ ✧ ◆ ✦</div>
    </div>

    <div class="menu">
      <button class="menu-button" onclick="window.location.href='level_main.html'">Play</button>
      <button class="menu-button" onclick="openControls()">Controls</button>
      <button class="menu-button">Quit Game</button>
    </div>
  </div>

  <div class="version">v.Alpha</div>
  <div class="footer">Created by OliFil Studio</div>

  
  <div id="controls-backdrop" onclick="closeControls()"></div>

  <div id="controls-modal">
    <div class="modal-titlebar">
      <span>Controls</span>
      <button class="modal-close" onclick="closeControls()">✕</button>
    </div>

    <div class="modal-body">

      <div class="controls-section">
        <div class="controls-section-title">Movement</div>
        <div class="control-row">
          <span class="control-label">Move</span>
          <div class="control-keys">
            <span class="key">W</span>
            <span class="key">A</span>
            <span class="key">S</span>
            <span class="key">D</span>
            <span class="key-sep">or</span>
            <span class="key">↑</span>
            <span class="key">←</span>
            <span class="key">↓</span>
            <span class="key">→</span>
          </div>
        </div>
      </div>

      <div class="controls-section">
        <div class="controls-section-title">Interaction</div>
        <div class="control-row">
          <span class="control-label">Interact / Confirm</span>
          <div class="control-keys">
            <span class="key">E</span>
            <span class="key-sep">or</span>
            <span class="key">Z</span>
          </div>
        </div>
        <div class="control-row">
          <span class="control-label">Open door</span>
          <div class="control-keys">
            <span class="key">E</span>
          </div>
        </div>
        <div class="control-row">
          <span class="control-label">Drop held item</span>
          <div class="control-keys">
            <span class="key">G</span>
          </div>
        </div>
        <div class="control-row">
          <span class="control-label">Close dialogue / Menu</span>
          <div class="control-keys">
            <span class="key">ESC</span>
          </div>
        </div>
      </div>

      <div class="controls-section">
        <div class="controls-section-title">Inventory</div>
        <div class="control-row">
          <span class="control-label">Select slot</span>
          <div class="control-keys">
            <span class="key">1</span>
            <span class="key">-</span>
            <span class="key">0</span>
          </div>
        </div>
      </div>

     

    </div>

    <div class="modal-footer">
      <span>Press ESC to close</span>
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="Music/Hollow Knight OST - Title Theme.mp3" type="audio/mpeg">
  </audio>

  <script>
    let musicStarted = false;
    document.addEventListener('click', () => {
      if (!musicStarted) {
        document.getElementById('bgMusic').play().catch(() => { });
        musicStarted = true;
      }
    });

    function openControls() {
      document.getElementById('controls-backdrop').classList.add('open');
      document.getElementById('controls-modal').classList.add('open');
    }

    function closeControls() {
      document.getElementById('controls-backdrop').classList.remove('open');
      document.getElementById('controls-modal').classList.remove('open');
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'Escape') closeControls();
    });
  </script>
</body>

</html>
