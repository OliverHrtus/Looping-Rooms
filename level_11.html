<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping Rooms</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #90EE90;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // PLAYER
        const player = {
            x: 100,
            y: canvas.height - 200,
            prevY: canvas.height - 200,
            width: 50,
            height: 50,
            velocityX: 0,
            velocityY: 0,
            isJumping: false,
            isCrouching: false,
            speed: 2.5,
            jumpPower: -8,
            gravity: 0.2,
            groundY: canvas.height - 150
        };

        // CAMERA
        const camera = {
            x: player.x,
            y: player.y,
            zoom: 1.5
        };

        // PLATFORMS
        const platforms = [
            { x: 300, y: canvas.height - 300, width: 200, height: 20 },
            { x: 600, y: canvas.height - 400, width: 150, height: 20 },
            { x: 900, y: canvas.height - 250, width: 180, height: 20 },
            { x: 1200, y: canvas.height - 350, width: 120, height: 20 },
            { x: 1500, y: canvas.height - 400, width: 150, height: 251 }
        ];

        const walls = [
            { x: 0, y: 0, width: 3000, height: 20 },
            { x: 0, y: 0, width: 20, height: canvas.height },
            { x: 2980, y: 0, width: 20, height: canvas.height }
        ];

        const door = [
            { x: 2800, y: canvas.height - 200, width: 50, height: 50 }
        ];

        // INPUT
        const keys = {};
        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyE') {
                checkDoorInteraction();
            }
        });
        document.addEventListener('keyup', e => keys[e.code] = false);


       
       // COLLISION
        function checkPlatformCollision() {
            for (let p of platforms) {
                if (player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y < p.y + p.height &&
                    player.y + player.height > p.y) {

                    if (player.prevY + player.height <= p.y) {
                        player.y = p.y - player.height;
                        player.velocityY = 0;
                        player.isJumping = false;
                        return true;
                    } else if (player.prevY >= p.y + p.height) {
                        player.y = p.y + p.height;
                        player.velocityY = 0;
                        return true;
                    } else {
                        if (player.velocityX > 0 && player.x < p.x) {
                            player.x = p.x - player.width;
                        } else if (player.velocityX < 0 && player.x > p.x) {
                            player.x = p.x + p.width;
                        }
                    }
                }
            }
            return false;
        }

        // DOOR INTERACTION
        function checkDoorInteraction() {
            for (let d of door) {
                if (player.x < d.x + d.width &&
                    player.x + player.width > d.x &&
                    player.y < d.y + d.height &&
                    player.y + player.height > d.y) {
                    window.location.href = 'level_12.html';
                    return;
                }
            }
        }

        // PLAYER UPDATE
        function updatePlayer() {

            // MOVEMENT
            if (keys['KeyA'] || keys['ArrowLeft']) player.velocityX = -player.speed;
            else if (keys['KeyD'] || keys['ArrowRight']) player.velocityX = player.speed;
            else player.velocityX = 0;

            if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && !player.isJumping) {
                player.velocityY = player.jumpPower;
                player.isJumping = true;
            }

            player.velocityY += player.gravity;
            player.prevY = player.y;

            player.x += player.velocityX;
            player.y += player.velocityY;

            if (!checkPlatformCollision()) {
                if (player.y >= player.groundY - player.height) {
                    player.y = player.groundY - player.height;
                    player.velocityY = 0;
                    player.isJumping = false;
                }
            }
        }

        // CAMERA
        function updateCamera() {
            const lerp = 0.1;
            camera.x += (player.x - camera.x) * lerp;
            camera.y += (player.y - camera.y) * lerp;
        }

        // 🎨 DRAW PLAYER (SPRITE)
        function drawPlayer() {
                ctx.fillStyle = 'red';
                ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        // ENVIRONMENT
        function drawEnvironment() {
            ctx.fillStyle = '#818589';
            ctx.fillRect(0, player.groundY, 3000, canvas.height);

            ctx.fillStyle = '#654321';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.width, p.height);
            });

            ctx.fillStyle = '#FFD700';
            door.forEach(d => {
                ctx.fillRect(d.x, d.y, d.width, d.height);
            });
        }

        // LOOP
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updatePlayer();
            updateCamera();

            ctx.setTransform(
                camera.zoom, 0,
                0, camera.zoom,
                canvas.width / 2 - camera.x * camera.zoom,
                canvas.height / 2 - camera.y * camera.zoom
            );

            drawEnvironment();
            drawPlayer();

            ctx.setTransform(1, 0, 0, 1, 0, 0);

            requestAnimationFrame(gameLoop);
        }

        // Start the game loop
        gameLoop();
    </script>
</body>

</html>
