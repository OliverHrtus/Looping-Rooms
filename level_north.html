<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping Rooms</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(22, 22, 22);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: transparent;
        }

        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .inv-slot {
            width: 56px;
            height: 56px;
            background: rgba(30, 30, 30, 0.85);
            border: 2px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: border-color 0.15s;
        }

        .inv-slot.active {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .inv-slot .slot-key {
            position: absolute;
            top: 3px;
            left: 5px;
            font-size: 10px;
            color: #888;
            font-family: monospace;
        }

        .inv-slot .item-icon {
            font-size: 26px;
            user-select: none;
        }

        .inv-slot .item-count {
            position: absolute;
            bottom: 3px;
            right: 5px;
            font-size: 11px;
            color: #fff;
            font-family: monospace;
            font-weight: bold;
        }

        #note-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background: #f5f0e8;
            border: 2px solid #c8b89a;
            border-radius: 4px;
            padding: 28px 32px;
            width: 320px;
            box-shadow: 6px 6px 24px rgba(0, 0, 0, 0.6);
            z-index: 20;
            display: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        #note-modal.open {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #note-modal h2 {
            margin: 0 0 14px 0;
            font-size: 14px;
            color: #888;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #note-modal p {
            margin: 0;
            font-size: 22px;
            color: #2a2a2a;
            font-family: 'Georgia', serif;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        #note-modal .close-hint {
            margin-top: 18px;
            font-size: 11px;
            color: #aaa;
            font-family: monospace;
            text-align: right;
        }

        #lockbox-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background: #1c1c1c;
            border: 3px solid #555;
            border-radius: 8px;
            padding: 30px 36px;
            width: 360px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            z-index: 20;
            display: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        #lockbox-modal.open {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #lockbox-modal h2 {
            margin: 0 0 4px 0;
            font-size: 13px;
            color: #888;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .box-icon {
            font-size: 42px;
            margin-bottom: 14px;
        }

        .digits {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 18px 0;
        }

        .digit-slot {
            width: 58px;
            height: 74px;
            background: #0a0a0a;
            border: 2px solid #444;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .d-arrow {
            width: 100%;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 13px;
            user-select: none;
            transition: color 0.1s, background 0.1s;
        }

        .d-arrow:hover {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.08);
        }

        .d-num {
            font-size: 30px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #fff;
            line-height: 1;
        }

        .lb-btn {
            margin-top: 4px;
            padding: 10px 32px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 6px;
            color: #ccc;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.15s;
        }

        .lb-btn:hover {
            background: #3a3a3a;
            border-color: #ffd700;
            color: #ffd700;
        }

        .lb-msg {
            margin-top: 12px;
            font-size: 13px;
            font-family: monospace;
            min-height: 18px;
            letter-spacing: 1px;
        }

        .lb-msg.error {
            color: #ff4444;
        }

        .lb-msg.success {
            color: #44ff88;
        }

        .lb-close-hint {
            margin-top: 12px;
            font-size: 11px;
            color: #444;
            font-family: monospace;
        }

        #pickup-prompt {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ffd700;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        #pickup-prompt.visible {
            opacity: 1;
        }

        #door-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(180, 30, 30, 0.92);
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 15;
            border: 1px solid #ff5555;
            white-space: nowrap;
        }

        #door-msg.visible {
            opacity: 1;
        }

        /* ── FADE OVERLAY ── */
        #fade-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 2s ease;
        }

        #fade-overlay.fading {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <div id="inventory">
        <div class="inv-slot active" id="slot-0"><span class="slot-key">1</span><span class="item-icon"
                id="icon-0"></span><span class="item-count" id="count-0"></span></div>
        <div class="inv-slot" id="slot-1"><span class="slot-key">2</span><span class="item-icon"
                id="icon-1"></span><span class="item-count" id="count-1"></span></div>
        <div class="inv-slot" id="slot-2"><span class="slot-key">3</span><span class="item-icon"
                id="icon-2"></span><span class="item-count" id="count-2"></span></div>
        <div class="inv-slot" id="slot-3"><span class="slot-key">4</span><span class="item-icon"
                id="icon-3"></span><span class="item-count" id="count-3"></span></div>
        <div class="inv-slot" id="slot-4"><span class="slot-key">5</span><span class="item-icon"
                id="icon-4"></span><span class="item-count" id="count-4"></span></div>
    </div>

    <div id="pickup-prompt"></div>
    <div id="door-msg"></div>
    <div id="fade-overlay"></div>

    <div id="note-modal">
        <h2 id="note-title"></h2>
        <p id="note-content"></p>
        <div class="close-hint">Press E or ESC to close</div>
    </div>

    <div id="lockbox-modal">
        <div class="box-icon" id="lb-icon">📦</div>
        <h2>Number Lock</h2>
        <div class="digits">
            <div class="digit-slot">
                <div class="d-arrow" id="up0">▲</div>
                <div class="d-num" id="dn0">0</div>
                <div class="d-arrow" id="dn0">▼</div>
            </div>
            <div class="digit-slot">
                <div class="d-arrow" id="up1">▲</div>
                <div class="d-num" id="dn1">0</div>
                <div class="d-arrow" id="dn1">▼</div>
            </div>
            <div class="digit-slot">
                <div class="d-arrow" id="up2">▲</div>
                <div class="d-num" id="dn2">0</div>
                <div class="d-arrow" id="dn2">▼</div>
            </div>
            <div class="digit-slot">
                <div class="d-arrow" id="up3">▲</div>
                <div class="d-num" id="dn3">0</div>
                <div class="d-arrow" id="dn3">▼</div>
            </div>
        </div>
        <button class="lb-btn" id="lb-unlock-btn">UNLOCK</button>
        <div class="lb-msg" id="lb-msg"></div>
        <div class="lb-close-hint">Press ESC to close</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const WORLD_WIDTH = 3000;
        const WORLD_HEIGHT = 1000;
        const GROUND_Y = WORLD_HEIGHT - 150;
        const LOCK_CODE = '6658';

        // ── LOCKBOX UI WIRING ─────────────────────────────────────
        const lbDigits = [0, 0, 0, 0];
        const lbNumEls = [
            document.getElementById('dn0'),
            document.getElementById('dn1'),
            document.getElementById('dn2'),
            document.getElementById('dn3'),
        ];

        function lbChangeDigit(idx, dir) {
            lbDigits[idx] = (lbDigits[idx] + dir + 10) % 10;
            lbNumEls[idx].textContent = lbDigits[idx];
            const msg = document.getElementById('lb-msg');
            msg.textContent = ''; msg.className = 'lb-msg';
        }

        const digitSlots = document.querySelectorAll('.digit-slot');
        digitSlots.forEach((slot, idx) => {
            const arrows = slot.querySelectorAll('.d-arrow');
            arrows[0].addEventListener('click', () => lbChangeDigit(idx, 1));
            arrows[1].addEventListener('click', () => lbChangeDigit(idx, -1));
        });

        document.getElementById('lb-unlock-btn').addEventListener('click', () => {
            const msg = document.getElementById('lb-msg');
            const entered = lbDigits.join('');
            if (entered === LOCK_CODE) {
                msg.textContent = '✓ Unlocked!';
                msg.className = 'lb-msg success';
                document.getElementById('lb-icon').textContent = '📭';
                if (currentLockbox) currentLockbox.unlocked = true;
                addToInventory({ id: 'elevator_card', icon: '🪪', label: 'Elevator Card', count: 1 });
                setTimeout(closeLockbox, 1200);
            } else {
                msg.textContent = '✗ Wrong code';
                msg.className = 'lb-msg error';
            }
        });

         // ── INVENTORY ─────────────────────────────────────────────
        const INVENTORY_SIZE = 5;
        const inventory = Array(INVENTORY_SIZE).fill(null);
        let activeSlot = 0;

        // ── SAVE / LOAD INVENTORY ────────────────────────────────

        function saveInventory() {
            localStorage.setItem(
                'looping_rooms_inventory',
                JSON.stringify(inventory)
            );
        }

        function loadInventory() {
            const saved = localStorage.getItem('looping_rooms_inventory');

            if (!saved) return;

            const parsed = JSON.parse(saved);

            for (let i = 0; i < INVENTORY_SIZE; i++) {
                inventory[i] = parsed[i];
            }

            renderInventory();
        }

        // OPTIONAL: clear inventory completely
        function clearInventory() {
            localStorage.removeItem('looping_rooms_inventory');

            for (let i = 0; i < INVENTORY_SIZE; i++) {
                inventory[i] = null;
            }

            renderInventory();
        }

        // ── ADD ITEM ─────────────────────────────────────────────

        function addToInventory(item) {

            // stack existing items
            for (let i = 0; i < INVENTORY_SIZE; i++) {
                if (inventory[i] && inventory[i].id === item.id) {
                    inventory[i].count++;

                    renderInventory();
                    saveInventory();

                    return true;
                }
            }

            // place in empty slot
            for (let i = 0; i < INVENTORY_SIZE; i++) {
                if (!inventory[i]) {

                    inventory[i] = {
                        ...item,
                        count: 1
                    };

                    renderInventory();
                    saveInventory();

                    return true;
                }
            }

            return false;
        }

        // ── RENDER INVENTORY ────────────────────────────────────

        function renderInventory() {

            for (let i = 0; i < INVENTORY_SIZE; i++) {

                document
                    .getElementById(`slot-${i}`)
                    .classList.toggle('active', i === activeSlot);

                document.getElementById(`icon-${i}`).textContent =
                    inventory[i]
                        ? inventory[i].icon
                        : '';

                document.getElementById(`count-${i}`).textContent =
                    inventory[i] && inventory[i].count > 1
                        ? inventory[i].count
                        : '';
            }
        }


        // ── WORLD ITEMS ───────────────────────────────────────────
        const worldItems = [
            { id: 'note_1', icon: '📄', label: 'Note #1', x: 300, width: 28, height: 28, collected: false, isNote: true, noteTitle: 'Note #1', noteContent: '6' },
            { id: 'note_2', icon: '📄', label: 'Note #2', x: 900, width: 28, height: 28, collected: false, isNote: true, noteTitle: 'Note #2', noteContent: '6' },
            { id: 'note_3', icon: '📄', label: 'Note #3', x: 1500, width: 28, height: 28, collected: false, isNote: true, noteTitle: 'Note #3', noteContent: '5' },
            { id: 'note_4', icon: '📄', label: 'Note #4', x: 2100, width: 28, height: 28, collected: false, isNote: true, noteTitle: 'Note #4', noteContent: '8' },
            { id: 'lockbox', icon: '📦', label: 'Lock Box', x: 1200, width: 50, height: 50, collected: false, isLockbox: true, unlocked: false },
            { id: 'key_east', icon: '🔑', label: 'East Key', x: 0, width: 28, height: 28, collected: false, isDoorKey: true, doorId: 'east' },
            { id: 'key_main', icon: '🔑', label: 'Main Key', x: 0, width: 28, height: 28, collected: false, isDoorKey: true, doorId: 'north' },

        ];
        const itemPositions = {
            note_1: [300, 460], note_2: [900, 500], note_3: [1500, 480], note_4: [2100, 500],
            lockbox: [1200, 490],
            key_east: [200, 600],
            key_main: [400, 200]
        };
        worldItems.forEach(item => { const p = itemPositions[item.id]; item.x = p[0]; item.y = p[1]; });

        // ── DROPPED ITEMS (dynamic world items from drops) ────────
        // These live alongside worldItems but are spawned at runtime.
        const droppedItems = [];
        let dropIdCounter = 0;

        function dropActiveItem() {
            if (noteOpen || lockboxOpen || isTransitioning) return;
            const slot = inventory[activeSlot];
            if (!slot) return;

            // Notes stay as world items; dropping them re-places them — they're readable again.
            // Build a dropped world item centered on the player.
            const itemW = slot.isLockbox ? 50 : 28;
            const itemH = slot.isLockbox ? 50 : 28;
            const dropX = player.x + player.width / 2 - itemW / 2;
            const dropY = player.y + player.height / 2 - itemH / 2;

            const dropped = {
                id: slot.id + '_drop_' + (dropIdCounter++),
                baseId: slot.id,        // original id for re-pickup stacking
                icon: slot.icon,
                label: slot.label,
                x: dropX,
                y: dropY,
                width: itemW,
                height: itemH,
                collected: false,
                isDropped: true,
                // carry over special flags
                isNote: slot.isNote || false,
                noteTitle: slot.noteTitle,
                noteContent: slot.noteContent,
                isLockbox: slot.isLockbox || false,
                unlocked: slot.unlocked || false,
                isDoorKey: slot.isDoorKey || false,
                doorId: slot.doorId,
            };

            droppedItems.push(dropped);

            // Decrement or remove from inventory
            if (slot.count > 1) {
                slot.count--;
            } else {
                inventory[activeSlot] = null;
            }
            renderInventory();
            saveInventory();

            feedbacks.push({ text: `- ${slot.label}`, x: player.x + 16, y: player.y - 10, alpha: 1.0, vy: -0.5, color: '#ff8888' });
        }

        // ── PLAYER ────────────────────────────────────────────────
        const player = {
            x: 1500, y: 950, prevY: WORLD_HEIGHT - 200,
            width: 32, height: 32, velocityX: 0, velocityY: 0,
            speed: 2
        };

        const camera = { x: player.x, y: player.y, zoom: 2 };

        // ── PLATFORMS ─────────────────────────────────────────────
        const platforms = [
            { x: 0, y: GROUND_Y, width: WORLD_WIDTH, height: 70 },
            { x: 350, y: WORLD_HEIGHT - 300, width: 200, height: 70 },
            { x: 600, y: WORLD_HEIGHT - 400, width: 150, height: 70 },
            { x: 300, y: WORLD_HEIGHT - 550, width: 180, height: 70 },
            { x: 650, y: WORLD_HEIGHT - 650, width: 200, height: 70 },
            { x: 985, y: WORLD_HEIGHT - 665, width: 50, height: 70 },
            { x: 350, y: WORLD_HEIGHT - 750, width: 130, height: 70 },
        ];

        const walls = [
            { x: 0, y: -130, width: WORLD_WIDTH, height: 20 },
            { x: 0, y: -130, width: 20, height: WORLD_HEIGHT + 200 },
            { x: WORLD_WIDTH - 20, y: -130, width: 20, height: WORLD_HEIGHT + 200 },
        ];

        const DOOR_W = 80; const DOOR_THICK = 20;
        const doors = [
            { id: 'main', side: 'bottom', x: WORLD_WIDTH / 2 - DOOR_W / 2, y: GROUND_Y, width: DOOR_W, height: DOOR_THICK, label: 'S' },
        ];
        const door = doors;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (player.y > GROUND_Y - player.height) player.y = GROUND_Y - player.height;
            player.prevY = player.y;
        });

        // ── NOTE MODAL ────────────────────────────────────────────
        const noteModal = document.getElementById('note-modal');
        const noteTitleEl = document.getElementById('note-title');
        const noteContentEl = document.getElementById('note-content');
        let noteOpen = false;

        function openNote(item) {
            noteTitleEl.textContent = item.noteTitle;
            noteContentEl.textContent = item.noteContent;
            noteModal.style.display = 'block';
            requestAnimationFrame(() => noteModal.classList.add('open'));
            noteOpen = true;
        }
        function closeNote() {
            noteModal.classList.remove('open');
            setTimeout(() => { noteModal.style.display = 'none'; }, 200);
            noteOpen = false;
        }

        // ── LOCKBOX MODAL ─────────────────────────────────────────
        const lockboxModal = document.getElementById('lockbox-modal');
        let lockboxOpen = false;
        let currentLockbox = null;

        function openLockbox(item) {
            currentLockbox = item;
            lbDigits.fill(0);
            lbNumEls.forEach(el => el.textContent = '0');
            const msg = document.getElementById('lb-msg');
            msg.textContent = ''; msg.className = 'lb-msg';
            document.getElementById('lb-icon').textContent = item.unlocked ? '📭' : '📦';
            lockboxModal.style.display = 'block';
            requestAnimationFrame(() => lockboxModal.classList.add('open'));
            lockboxOpen = true;
        }
        function closeLockbox() {
            lockboxModal.classList.remove('open');
            setTimeout(() => { lockboxModal.style.display = 'none'; }, 200);
            lockboxOpen = false;
            currentLockbox = null;
        }

        // ── FADE TRANSITION ───────────────────────────────────────
        const fadeOverlay = document.getElementById('fade-overlay');
        let isTransitioning = false;

        function fadeToLevel(url) {

            if (isTransitioning) return;

            // SAVE INVENTORY BEFORE CHANGING ROOM
            saveInventory();

            isTransitioning = true;

            fadeOverlay.classList.add('fading');

            setTimeout(() => {
                window.location.href = url;
            }, 2000);
        }

        // ── INPUT ─────────────────────────────────────────────────
        const keys = {};
        document.addEventListener('keydown', e => {
            if (noteOpen && (e.code === 'KeyE' || e.code === 'Escape')) { closeNote(); return; }
            if (lockboxOpen && e.code === 'Escape') { closeLockbox(); return; }

            keys[e.code] = true;

            if (e.code >= 'Digit1' && e.code <= 'Digit5') {
                activeSlot = parseInt(e.code.replace('Digit', '')) - 1;
                renderInventory();
            }
            if (e.code === 'KeyE') { tryInteract(); }
            if (e.code === 'KeyG') { dropActiveItem(); }
        });
        document.addEventListener('keyup', e => keys[e.code] = false);
        ;

        // ── PROXIMITY HELPERS ─────────────────────────────────────
        const pickupPromptEl = document.getElementById('pickup-prompt');
        const feedbacks = [];

        function getNearbyItem() {
            const reach = 55;
            // Check dropped items first (on top of world items)
            for (let item of droppedItems) {
                if (item.collected) continue;
                const dx = (player.x + player.width / 2) - (item.x + item.width / 2);
                const dy = (player.y + player.height / 2) - (item.y + item.height / 2);
                if (Math.abs(dx) < reach && Math.abs(dy) < reach) return item;
            }
            for (let item of worldItems) {
                if (!item.isNote && !item.isLockbox && item.collected) continue;
                const dx = (player.x + player.width / 2) - (item.x + item.width / 2);
                const dy = (player.y + player.height / 2) - (item.y + item.height / 2);
                if (Math.abs(dx) < reach && Math.abs(dy) < reach) return item;
            }
            return null;
        }

        function getNearDoor() {
            const reach = 60;
            for (let d of doors) {
                const dx = (player.x + player.width / 2) - (d.x + d.width / 2);
                const dy = (player.y + player.height / 2) - (d.y + d.height / 2);
                if (Math.abs(dx) < reach && Math.abs(dy) < reach) return d;
            }
            return null;
        }
        function isNearDoor() { return getNearDoor() !== null; }

        // ── INTERACT ──────────────────────────────────────────────
        const doorMsgEl = document.getElementById('door-msg');
        let doorMsgTimer = null;

        function showDoorMsg(text) {
            doorMsgEl.textContent = text;
            doorMsgEl.classList.add('visible');
            clearTimeout(doorMsgTimer);
            doorMsgTimer = setTimeout(() => doorMsgEl.classList.remove('visible'), 2200);
        }

        function hasItem(id) {
            // Check inventory for exact id OR base door key id
            return inventory.some(slot => slot && (slot.id === id || slot.baseId === id));
        }

        function tryInteract() {
            const nearDoor = getNearDoor();
            if (nearDoor) {
                const keyId = 'key_' + nearDoor.id;
                if (hasItem(keyId)) {
                    fadeToLevel(`level_${nearDoor.id}.html`);
                } else {
                    showDoorMsg(`🔒 Need the ${nearDoor.id.charAt(0).toUpperCase() + nearDoor.id.slice(1)} Key to open this door`);
                }
                return;
            }

            const item = getNearbyItem();
            if (!item) return;
            if (item.isNote) { openNote(item); return; }
            if (item.isLockbox) { openLockbox(item); return; }

            // Determine the id to use for stacking — use baseId if it's a dropped re-pickup
            const stackId = item.baseId || item.id;
            const invItem = { ...item, id: stackId };
            const added = addToInventory(invItem);
            if (added) {
                item.collected = true;
                feedbacks.push({ text: `+ ${item.label}`, x: player.x + 16, y: player.y - 10, alpha: 1.0, vy: -0.5, color: '#ffd700' });
            }
        }

        // ── COLLISION ─────────────────────────────────────────────
        const obstacles = [
            { x: 500, y: 300, width: 120, height: 60 },
            { x: 900, y: 400, width: 80, height: 80 },
            { x: 1400, y: 350, width: 150, height: 50 },
            { x: 1800, y: 300, width: 100, height: 80 },
            { x: 2200, y: 450, width: 120, height: 60 },
            { x: 2600, y: 350, width: 80, height: 80 },
        ];

        function checkObstacleCollision() {
            for (let o of obstacles) {
                if (player.x < o.x + o.width && player.x + player.width > o.x &&
                    player.y < o.y + o.height && player.y + player.height > o.y) {
                    const overlapL = (player.x + player.width) - o.x;
                    const overlapR = (o.x + o.width) - player.x;
                    const overlapT = (player.y + player.height) - o.y;
                    const overlapB = (o.y + o.height) - player.y;
                    const minX = Math.min(overlapL, overlapR);
                    const minY = Math.min(overlapT, overlapB);
                    if (minX < minY) {
                        player.x += overlapL < overlapR ? -overlapL : overlapR;
                    } else {
                        player.y += overlapT < overlapB ? -overlapT : overlapB;
                    }
                }
            }
        }

        // ── PLAYER UPDATE ─────────────────────────────────────────
        function updatePlayer() {
            if (noteOpen || lockboxOpen || isTransitioning) return;

            player.velocityX = 0;
            player.velocityY = 0;
            if (keys['KeyA'] || keys['ArrowLeft']) player.velocityX = -player.speed;
            if (keys['KeyD'] || keys['ArrowRight']) player.velocityX = player.speed;
            if (keys['KeyW'] || keys['ArrowUp']) player.velocityY = -player.speed;
            if (keys['KeyS'] || keys['ArrowDown']) player.velocityY = player.speed;

            if (player.velocityX !== 0 && player.velocityY !== 0) {
                player.velocityX *= 0.707;
                player.velocityY *= 0.707;
            }

            player.x += player.velocityX;
            player.y += player.velocityY;

            player.x = Math.max(WORLD_LEFT + 2, Math.min(WORLD_RIGHT - player.width - 2, player.x));
            player.y = Math.max(WORLD_TOP + 2, Math.min(GROUND_Y - player.height - 2, player.y));

            checkObstacleCollision();
        }

        function updateCamera() {
            const lerp = 0.1;
            camera.x += (player.x + player.width / 2 - camera.x) * lerp;
            camera.y += (player.y + player.height / 2 - camera.y) * lerp;

            const INV_OFFSET = 76;
            const maxCamY = GROUND_Y - (canvas.height / 2 - INV_OFFSET) / camera.zoom;

            const halfW = (canvas.width / 2) / camera.zoom;
            const halfH = (canvas.height / 2) / camera.zoom;

            camera.x = Math.max(WORLD_LEFT + halfW, Math.min(WORLD_RIGHT - halfW, camera.x));
            camera.y = Math.max(WORLD_TOP + halfH, Math.min(maxCamY, camera.y));
        }

        // ── DRAW ──────────────────────────────────────────────────

        function drawPlayer() {
            const cx = player.x + player.width / 2;
            const cy = player.y + player.height / 2;
            const r = player.width / 2;
            ctx.fillStyle = '#e05555';
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        }

        function drawSingleItem(item, bobY) {
            const cx = item.x + item.width / 2;
            const cy = bobY + item.height / 2;
            const gc = item.isLockbox ? (item.unlocked ? 'rgba(68,255,136,' : 'rgba(255,80,80,') : 'rgba(255,215,0,';
            const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 28);
            grad.addColorStop(0, gc + '0.35)');
            grad.addColorStop(1, gc + '0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.fill();

            if (item.isLockbox) {
                ctx.fillStyle = item.unlocked ? '#1a3a2a' : '#2a1a1a';
                ctx.strokeStyle = item.unlocked ? '#44ff88' : '#ff5050';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(item.x, bobY, item.width, item.height, 5);
                ctx.fill(); ctx.stroke();
                ctx.font = '22px serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(item.unlocked ? '📭' : '🔒', cx, cy);
                ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            } else {
                ctx.font = `${item.width}px serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(item.icon, cx, cy);
                ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            }
        }

        function drawWorldItems() {
            const t = Date.now() / 600;

            // Draw static world items
            worldItems.forEach((item, idx) => {
                if (!item.isNote && !item.isLockbox && item.collected) return;
                const bobY = item.y + Math.sin(t + idx * 1.3) * 4;
                drawSingleItem(item, bobY);
            });

            // Draw dropped items with a subtle "dropped" indicator
            droppedItems.forEach((item, idx) => {
                if (item.collected) return;
                const bobY = item.y + Math.sin(t + idx * 2.1 + 99) * 3;

                // Slightly dimmer glow to distinguish dropped items
                ctx.globalAlpha = 0.88;
                drawSingleItem(item, bobY);
                ctx.globalAlpha = 1;

            });
        }

        function drawFeedbacks() {
            ctx.save();
            for (let i = feedbacks.length - 1; i >= 0; i--) {
                const f = feedbacks[i];
                ctx.globalAlpha = f.alpha;
                ctx.fillStyle = f.color || '#ffd700';
                ctx.font = 'bold 13px monospace';
                ctx.fillText(f.text, f.x, f.y);
                f.y += f.vy; f.alpha -= 0.012;
                if (f.alpha <= 0) feedbacks.splice(i, 1);
            }
            ctx.globalAlpha = 1; ctx.restore();
        }

        const WORLD_LEFT = 20;
        const WORLD_RIGHT = WORLD_WIDTH - 20;
        const WORLD_TOP = -110;

        function drawEnvironment() {
            const tileSize = 48;
            for (let tx = WORLD_LEFT; tx < WORLD_RIGHT; tx += tileSize) {
                for (let ty = WORLD_TOP; ty < GROUND_Y; ty += tileSize) {
                    const alt = ((Math.floor((tx - WORLD_LEFT) / tileSize) + Math.floor((ty - WORLD_TOP) / tileSize)) % 2 === 0);
                    ctx.fillStyle = alt ? '#1a1a1a' : '#1e1e1e';
                    ctx.fillRect(tx, ty, tileSize, tileSize);
                }
            }

            const BORDER = '#111';
            ctx.fillStyle = BORDER;
            ctx.fillRect(-500, -500, WORLD_LEFT + 500, WORLD_HEIGHT + 1000);
            ctx.fillRect(WORLD_RIGHT, -500, 500, WORLD_HEIGHT + 1000);
            ctx.fillRect(-500, -500, WORLD_WIDTH + 1000, WORLD_TOP + 500);
            ctx.fillRect(-500, GROUND_Y, WORLD_WIDTH + 1000, 500);

            ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
            ctx.strokeRect(WORLD_LEFT, WORLD_TOP, WORLD_RIGHT - WORLD_LEFT, GROUND_Y - WORLD_TOP);

            obstacles.forEach(o => {
                ctx.fillStyle = '#2d2218';
                ctx.fillRect(o.x, o.y, o.width, o.height);
                ctx.strokeStyle = '#5a3e28'; ctx.lineWidth = 2;
                ctx.strokeRect(o.x, o.y, o.width, o.height);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(o.x + 4, o.y + o.height, o.width, 4);
                ctx.fillRect(o.x + o.width, o.y + 4, 4, o.height);
            });

            doors.forEach(d => {
                const hasKey = inventory.some(s => s && (s.id === 'key_' + d.id || s.baseId === 'key_' + d.id));
                const col = hasKey ? '#1a2e1a' : '#1a1a2e';
                const stroke = hasKey ? '#44cc55' : '#4455cc';
                const glow = hasKey ? '#44ff66' : '#5566ff';
                const cx = d.x + d.width / 2;
                const cy = d.y + d.height / 2;

                ctx.fillStyle = col;
                ctx.fillRect(d.x, d.y, d.width, d.height);

                ctx.shadowColor = glow; ctx.shadowBlur = 14;
                ctx.strokeStyle = stroke; ctx.lineWidth = 2;
                ctx.strokeRect(d.x, d.y, d.width, d.height);
                ctx.shadowBlur = 0;

                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = hasKey ? '#aaffbb' : '#aabbff';
                ctx.fillText(hasKey ? '🔓' : '🔒', cx, cy - 6);
                ctx.fillStyle = hasKey ? '#aaffbb' : '#aabbff';
                ctx.font = 'bold 9px monospace';
                ctx.fillText(d.label, cx, cy + 7);
                ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            });
        }

        // ── GAME LOOP ─────────────────────────────────────────────
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updatePlayer();
            updateCamera();

            const nearDoorObj = getNearDoor();
            const nearItem = getNearbyItem();

            if (nearDoorObj) {
                pickupPromptEl.textContent = `🚪 Press E to go ${nearDoorObj.id.toUpperCase()} (${nearDoorObj.label})`;
                pickupPromptEl.classList.add('visible');
            } else if (nearItem) {
                pickupPromptEl.textContent =
                    nearItem.isNote ? `Press E to read ${nearItem.label}` :
                        nearItem.isLockbox ? `Press E to open ${nearItem.label}` :
                            `Press E to pick up ${nearItem.label}`;
                pickupPromptEl.classList.add('visible');
            } else {
                pickupPromptEl.classList.remove('visible');
            }

            const tx = canvas.width / 2 - camera.x * camera.zoom;
            const ty = canvas.height / 2 - camera.y * camera.zoom;
            const clipX = WORLD_LEFT * camera.zoom + tx;
            const clipY = WORLD_TOP * camera.zoom + ty;
            const clipW = (WORLD_RIGHT - WORLD_LEFT) * camera.zoom;
            const clipH = (GROUND_Y - WORLD_TOP) * camera.zoom;

            ctx.save();
            ctx.beginPath();
            ctx.rect(clipX, clipY, clipW, clipH);
            ctx.clip();

            ctx.setTransform(camera.zoom, 0, 0, camera.zoom, tx, ty);

            drawEnvironment();
            drawWorldItems();
            drawPlayer();
            drawFeedbacks();

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.restore();
            requestAnimationFrame(gameLoop);
        }
        loadInventory();
        renderInventory();
        gameLoop();
    </script>
</body>

</html>
